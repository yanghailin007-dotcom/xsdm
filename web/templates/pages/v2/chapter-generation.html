<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正文生成 - NovelCraft</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">
    <script>
        (function(){var t=localStorage.getItem('v2-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
    </script>
    <script src="/static/js/v2-theme.js"></script>
    <style>
        :root {
            --bg-primary: #0d0d12;
            --bg-secondary: #16161c;
            --bg-tertiary: #22222a;
            --bg-message: #1c1c24;
            --border-color: rgba(255,255,255,0.10);
            --border-light: rgba(255,255,255,0.06);
            --text-primary: #e2e2e8;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent: #8b5cf6;
            --accent-dim: rgba(139,92,246,0.15);
            --accent-border: rgba(139,92,246,0.3);
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --glow: 0 0 20px rgba(139,92,246,0.15);
            --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
        }
        
        html[data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f1f3f4;
            --bg-message: #f8f9fa;
            --border-color: #e5e7eb;
            --border-light: #f1f3f4;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --accent-dim: rgba(139,92,246,0.1);
            --accent-border: rgba(139,92,246,0.25);
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --glow: 0 0 20px rgba(139,92,246,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 15px;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* ===== 顶部导航 ===== */
        .top-nav {
            height: 56px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }
        .nav-left { display: flex; align-items: center; gap: 16px; }
        .nav-logo {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 4px; }
        .nav-links a {
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
        }
        .nav-links a:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .nav-links a.active { background: rgba(139,92,246,0.15); color: #a78bfa; }

        .nav-right { display: flex; align-items: center; gap: 10px; }
        .nav-model-select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
        }
        .nav-user { font-size: 12px; color: var(--text-secondary); }

        /* ===== 主体布局 ===== */
        .main-wrapper {
            height: calc(100vh - 56px);
            display: grid;
            grid-template-columns: 320px 1fr;
            overflow: hidden;
        }

        /* ===== 左侧面板 ===== */
        .left-panel {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .config-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px;
            transition: border-color 0.2s;
        }
        .config-card:hover { border-color: var(--border-hover); }
        .config-card h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group:last-child { margin-bottom: 0; }
        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .form-group select,
        .form-group input[type="number"] {
            width: 100%;
            padding: 8px 11px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group select:focus,
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .gen-btn {
            width: 100%;
            padding: 10px 14px;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            letter-spacing: 0.5px;
        }
        .gen-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--glow); filter: brightness(1.1); }
        .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .gen-btn.running {
            background: linear-gradient(135deg, var(--warning), #d97706);
            animation: btnPulse 2s infinite;
        }
        @keyframes btnPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        .gen-btn.secondary {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .gen-btn.secondary:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: none;
            filter: none;
        }

        .status-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px;
            font-size: 11px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .status-row:last-child { margin-bottom: 0; }
        .status-row .val {
            font-weight: 600;
            color: var(--text-primary);
            font-family: var(--font-mono);
        }
        .status-row .val.success { color: var(--success); }
        .status-row .val.error { color: var(--error); }
        .status-row .val.warning { color: var(--warning); }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: var(--bg-primary);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #a78bfa);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* ===== 故事线视图（在右侧正文区域展示） ===== */
        .storyline-view {
            padding: 24px 32px;
            overflow-y: auto;
            flex: 1;
        }
        .storyline-view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .storyline-view-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .storyline-back-btn {
            padding: 6px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .storyline-back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .storyline-big-timeline {
            position: relative;
            padding-left: 32px;
            max-width: 900px;
            margin: 0 auto;
        }
        .storyline-big-timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 12px;
            bottom: 12px;
            width: 3px;
            background: linear-gradient(to bottom, var(--accent), rgba(139,92,246,0.15));
            border-radius: 2px;
        }
        .storyline-big-node {
            position: relative;
            margin-bottom: 28px;
            padding: 20px 24px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .storyline-big-node:hover {
            border-color: var(--accent-border);
            box-shadow: var(--glow);
        }
        .storyline-big-node:last-child { margin-bottom: 0; }
        .storyline-big-dot {
            position: absolute;
            left: -30px;
            top: 24px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 3px solid var(--bg-primary);
            box-shadow: 0 0 0 2px var(--accent-border);
            z-index: 1;
        }
        .storyline-big-dot.hook { background: var(--warning); box-shadow: 0 0 0 2px rgba(245,158,11,0.4); }
        .storyline-big-dot.climax { background: var(--error); box-shadow: 0 0 0 2px rgba(239,68,68,0.4); }
        .storyline-big-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            transition: color 0.2s;
            margin-bottom: 12px;
        }
        .storyline-big-title:hover { color: var(--accent); }
        .storyline-big-title .ch-num {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            margin-right: 6px;
        }
        .storyline-big-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .storyline-big-section {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
        }
        .storyline-big-section.full { grid-column: 1 / -1; }
        .storyline-big-section h4 {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .storyline-big-section p {
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.6;
        }
        .storyline-big-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .storyline-big-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
        }
        .storyline-big-tag:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .storyline-big-tag.char {
            background: rgba(59,130,246,0.12);
            color: #60a5fa;
        }
        .storyline-big-tag.hook {
            background: rgba(245,158,11,0.15);
            color: #b45309;
        }
        .storyline-big-tag.scene {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }
        .storyline-big-tag.emotion {
            background: rgba(236,72,153,0.12);
            color: #f472b6;
        }
        .storyline-big-steps {
            padding-left: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .storyline-big-steps li { margin-bottom: 4px; }
        .storyline-big-dialogues {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .storyline-big-dialogue {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 6px 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            border-left: 2px solid var(--accent);
        }
        .storyline-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 20px;
            font-size: 14px;
        }

        /* ===== 右侧面板 ===== */
        .right-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 参考侧滑面板 */
        .ref-drawer {
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 55%;
            min-width: 380px;
            max-width: 600px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 32px rgba(0,0,0,0.3);
        }
        .ref-drawer.open {
            transform: translateX(0);
        }
        .ref-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-tertiary);
        }
        .ref-tabs {
            display: flex;
            gap: 4px;
        }
        .ref-tab-btn {
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
        }
        .ref-tab-btn:hover { color: var(--text-primary); background: var(--bg-primary); }
        .ref-tab-btn.active {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent-border);
        }
        .ref-drawer-close {
            width: 28px; height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ref-drawer-close:hover { background: var(--bg-primary); color: var(--text-primary); }
        .ref-drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            font-size: 13px;
            line-height: 1.7;
        }
        .ref-drawer-body h1, .ref-drawer-body h2, .ref-drawer-body h3 {
            margin: 16px 0 10px;
            color: var(--text-primary);
        }
        .ref-drawer-body p { margin: 8px 0; color: var(--text-secondary); }
        .ref-drawer-body ul, .ref-drawer-body ol { margin: 8px 0; padding-left: 20px; }
        .ref-drawer-body li { margin: 4px 0; color: var(--text-secondary); }
        .ref-drawer-body code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--accent);
        }
        .ref-drawer-body blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            margin: 10px 0;
            color: var(--text-muted);
        }
        .ref-drawer-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 12px;
        }
        .ref-drawer-body th, .ref-drawer-body td {
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            text-align: left;
        }
        .ref-drawer-body th {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-weight: 600;
        }

        .chapter-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 14px;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .chapter-tab {
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }
        .chapter-tab:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .chapter-tab.active {
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent-border);
        }
        .chapter-tab .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .chapter-tab .dot.pending { background: var(--text-muted); }
        .chapter-tab .dot.generating { background: var(--warning); animation: pulse 1.2s infinite; }
        .chapter-tab .dot.generated { background: var(--success); }
        .chapter-tab .dot.failed { background: var(--error); }
        .chapter-tab.ref-tab {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--accent);
        }
        .chapter-tab.ref-tab:hover {
            background: var(--accent-dim);
            border-color: var(--accent-border);
        }
        .chapter-tab.ref-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .chapter-tab .ch-title {
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .content-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .content-header {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .content-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.3px;
        }
        .content-header .actions {
            display: flex;
            gap: 6px;
        }
        .content-header .actions button {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .content-header .actions button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .content-header .actions button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .content-body {
            flex: 1;
            padding: 20px 28px;
            overflow-y: auto;
            line-height: 1.75;
            font-size: 16px;
            color: var(--text-primary);
        }
        /* 手机端阅读优化 */
        @media (max-width: 768px) {
            .content-body {
                padding: 16px 20px;
                font-size: 17px;
                line-height: 1.8;
            }
        }
        .content-body.edit-mode {
            padding: 0;
        }
        .edit-textarea {
            width: 100%;
            height: 100%;
            min-height: 400px;
            padding: 20px 28px;
            background: var(--bg-primary);
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.8;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }
        .edit-textarea:focus {
            box-shadow: inset 0 0 0 2px var(--accent);
        }
        /* 番茄 APP 标准：空行分隔，无首行缩进 */
        .content-body p {
            margin-bottom: 0.5em;
            text-indent: 2em;
            line-height: 1.75;
        }
        /* 场景/动作过渡短句（≤15字）——保持独立段落，番茄风格 */
        .content-body p.short {
            margin-bottom: 0.4em;
        }
        /* 对话段落——与普通叙述同格式，网文不额外缩进 */
        .content-body p.dialogue {
            margin-bottom: 0.4em;
        }
        .content-body mark {
            transition: background 0.2s;
        }
        .content-body mark:hover {
            filter: brightness(1.3);
        }
        .content-body.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .thinking-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            margin: 6px 14px 0;
            flex-shrink: 0;
            max-width: fit-content;
        }
        .thinking-box .thinking-header {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            color: var(--warning);
            cursor: pointer;
            user-select: none;
        }
        .thinking-box .thinking-header .toggle-icon {
            margin-left: 6px;
            font-size: 10px;
            transition: transform 0.2s;
        }
        .thinking-box .thinking-header .toggle-icon.expanded {
            transform: rotate(90deg);
        }
        .thinking-box .thinking-body {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            line-height: 1.5;
            white-space: pre-wrap;
            max-height: 160px;
            overflow-y: auto;
        }
        .thinking-box .thinking-body.collapsed { display: none; }

        /* ===== 质检面板 ===== */
        .quality-panel {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 14px 16px;
            max-height: 280px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .quality-panel h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .quality-summary {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .quality-score {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            min-width: 80px;
            text-align: center;
        }
        .quality-score .score-val {
            font-size: 24px;
            font-weight: 700;
            font-family: var(--font-mono);
        }
        .quality-score .score-val.high { color: var(--success); }
        .quality-score .score-val.mid { color: var(--warning); }
        .quality-score .score-val.low { color: var(--error); }
        .quality-score .score-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 3px;
        }
        .quality-result {
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;

        .quality-result.pass {
            background: rgba(34,197,94,0.12);
            color: var(--success);
            border: 1px solid rgba(34,197,94,0.25);

            background: rgba(239,68,68,0.12);
            color: var(--error);

        .issue-list {
            list-style: none;
            padding: 0;
            margin: 0;

        .issue-item {
            background: var(--bg-tertiary);

            align-items: center;

        .issue-badge {
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;

        .issue-badge.critical { background: rgba(239,68,68,0.2); color: var(--error); }
        .issue-badge.warning { background: rgba(245,158,11,0.2); color: var(--warning); }
        .issue-badge.suggestion { background: rgba(59,130,246,0.2); color: var(--info); }
        .issue-badge.cat {
            background: var(--bg-primary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .issue-desc { color: var(--text-primary); line-height: 1.5; margin-bottom: 3px; }
        .issue-fix { color: var(--text-muted); font-style: italic; }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            display: none;
        }
        .toast.show { display: block; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }
        .toast.info { background: var(--info); }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        /* ===== 自定义滚动条 ===== */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ===== 重写弹窗 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            width: 90%;
            max-width: 520px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-box h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        .modal-box textarea {
            width: 100%;
            min-height: 100px;
            padding: 8px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);

            margin-bottom: 12px;

        .modal-actions {

        .modal-actions button {

        .modal-actions .btn-primary {

        }
        .modal-actions .btn-secondary {

        }

        @media (max-width: 1024px) {
            .main-wrapper { grid-template-columns: 1fr; }
            .left-panel {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                max-height: 50vh;

        /* ===== 故事线剧照 ===== */
        .still-image-grid {

        }

        }
        .still-generate-btn {

        }
        .still-generate-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }
        .still-generate-btn:disabled {

        /* 剧照生成模态框 */
        .still-modal-overlay {
            position: fixed;
            inset: 0;

</head>
<body>
    <!-- 顶部导航 -->
    <header class="top-nav">
        <div class="nav-left">
            <a href="/" class="nav-logo">大文娱</a>
            <div class="nav-links">
                <a href="/">工作台</a>
                <a href="/novelcraft">自由创作</a>
                <a href="/chapter-generation" class="active">正文生成</a>
            </div>
        </div>
        <div class="nav-right">
            <span class="nav-user" id="navUser"></span>
        </div>
    </header>

    <!-- 主体 -->
    <div class="main-wrapper">
        <!-- 左侧面板 -->
        <div class="left-panel">
            <!-- 项目配置 -->
            <div class="config-card">
                <h3>📚 项目选择</h3>
                <div class="form-group">
                    <label>项目</label>
                    <select id="projectSelect"><option value="">-- 加载中 --</option></select>
                </div>
                <div class="form-group">
                    <label>卷号</label>
                    <select id="volumeSelect">
                        <option value="1" selected>第1卷</option>
                        <option value="2">第2卷</option>
                        <option value="3">第3卷</option>
                        <option value="4">第4卷</option>
                        <option value="5">第5卷</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>模型</label>
                    <select id="modelSelect">
                        <option value="deepseek-v4-pro" selected>DeepSeek-V4-Pro</option>
                        <option value="deepseek-v4-flash">DeepSeek-V4-Flash</option>
                        <option value="kimi-k2.5">Kimi-K2.5</option>
                        <option value="gemini-3-flash">Gemini-3-Flash</option>
                    </select>
                </div>
            </div>

            <!-- 生成设置 -->
            <div class="config-card">
                <h3>⚙️ 生成设置</h3>
                <div class="form-group">
                    <label>起始章节</label>
                    <input type="number" id="startChapter" value="1" min="1" />
                </div>
                <div class="form-group">
                    <label>每批章数</label>
                    <input type="number" id="batchSize" value="6" min="1" max="10" />
                </div>
                <button id="generateBtn" class="gen-btn">
                    <span>✨</span> 开始生成
                </button>
                <button id="qualityCheckBtn" class="gen-btn secondary" style="margin-top:8px;" disabled>
                    <span>🔍</span> 对齐质检
                </button>
                <button id="nextBatchBtn" class="gen-btn secondary" style="margin-top:8px;display:none;" onclick="startNextBatch()">
                    <span>▶️</span> 继续下一批
                </button>
                <button id="genVolOutlineBtn" class="gen-btn secondary" style="margin-top:8px;" onclick="openVolumeOutlinePage()">
                    <span>📋</span> 生成本卷细纲
                </button>
            </div>

            <!-- 状态 -->
            <div class="status-card" id="statusCard">
                <div class="status-row"><span>生成状态</span><span class="val" id="statusText">未开始</span></div>
                <div class="status-row"><span>已生成章节</span><span class="val" id="generatedCount">0 / 0</span></div>
                <div class="status-row"><span>当前章节</span><span class="val" id="currentChapterText">-</span></div>
                <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            </div>

            <!-- 故事线入口 -->
            <button class="gen-btn secondary" id="storylineBtn" style="margin-top:8px;" onclick="showStorylineView()" disabled>
                <span>📖</span> 故事线
            </button>

        </div>

        <!-- 右侧面板 -->
        <div class="right-panel">
            <!-- 章节标签页 -->
            <div class="chapter-tabs" id="chapterTabs"></div>

            <!-- 思考区 -->
            <div id="thinkingContainer"></div>

            <!-- 内容区域 -->
            <div class="content-card">
                <div class="content-header">
                    <h3 id="contentTitle">章节内容</h3>
                    <div class="actions" id="contentActions">
                        <button id="editBtn" style="display:none;">✏️ 编辑</button>
                        <button id="cancelEditBtn" style="display:none;">❌ 取消</button>
                        <button id="copyBtn" style="display:none;">📋 复制</button>
                        <button id="rewriteBtn" disabled>🔄 重写</button>
                        <button id="saveBtn" disabled>💾 保存</button>
                    </div>
                </div>
                <div class="content-body empty" id="contentBody">请选择项目并点击「开始生成」</div>
            </div>

            <!-- 质检面板 -->
            <div class="quality-panel" id="qualityPanel" style="display:none;">
                <h3>🔍 对齐质检报告</h3>
                <div class="quality-summary" id="qualitySummary"></div>
                <ul class="issue-list" id="issueList"></ul>
            </div>

            <!-- 参考侧滑面板（设定/大纲/细纲） -->
            <div class="ref-drawer" id="refDrawer">
                <div class="ref-drawer-header">
                    <div class="ref-tabs">
                        <button class="ref-tab-btn" data-ref="settings" onclick="showRefInDrawer('settings')">📖 设定</button>
                        <button class="ref-tab-btn" data-ref="outline" onclick="showRefInDrawer('outline')">📄 大纲</button>
                        <button class="ref-tab-btn" data-ref="detailed" onclick="showRefInDrawer('detailed')">📋 细纲</button>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <select id="outlineVolSelect" onchange="switchOutlineVolume(this.value)" style="display:none;padding:3px 6px;border-radius:4px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);font-size:12px;">
                            <option value="all">全书框架</option>
                        </select>
                        <button class="ref-drawer-close" onclick="closeRefDrawer()" title="关闭">✕</button>
                    </div>
                </div>
                <div class="ref-drawer-body" id="refDrawerBody">
                    <p style="color:var(--text-muted);">点击上方标签查看参考内容</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 重写弹窗 -->
    <div class="modal-overlay" id="rewriteModal">
        <div class="modal-box">
            <h3>🔄 重写章节 <span id="rewriteChapterNum"></span></h3>
            <label style="font-size:11px;color:var(--text-secondary);display:block;margin-bottom:6px;">修改要求</label>
            <textarea id="rewriteInstruction" placeholder="如：增加打脸力度、加强钩子、修正设定偏差等..."></textarea>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeRewriteModal()">取消</button>
                <button class="btn-primary" onclick="confirmRewrite()">确认重写</button>
            </div>
        </div>
    </div>

    <!-- 剧照生成模态框 -->
    <div class="still-modal-overlay" id="stillModal">
        <div class="still-modal-box">
            <h3 id="stillModalTitle">🎬 生成剧照</h3>
            <label>提示词（可编辑）</label>
            <textarea id="stillPrompt" placeholder="输入生成提示词..."></textarea>
            <div class="still-modal-actions">
                <button class="btn-secondary" onclick="closeStillModal()">取消</button>
                <button class="btn-primary" id="stillGenerateBtn" onclick="confirmGenerateStill()">生成</button>
            </div>
        </div>
    </div>

    <script>

// ===== 状态 =====
let projects = [];
let currentProject = null;
let chapters = {}; // { chNum: { title, content, status } }
let isGenerating = false;
let currentBatchStart = 1;
let currentBatchEnd = 6;
let sessionMessages = []; // 每卷一个会话的消息历史
let currentVolume = 1;
let lastVolumeSession = null; // 记录上一次生成时使用的卷号，切换卷时重置对话上下文
let activeChapter = null;
let qualityReport = null; // 当前质检报告
let projectFiles = null; // 当前项目文件（细纲等）
let showingRef = false; // 是否正在显示参考内容（设定/大纲/细纲）
let currentRefType = ''; // 'settings' | 'outline' | 'detailed'
let isEditMode = false; // 是否处于编辑模式
let editCache = ''; // 编辑缓存
let outlineVolumes = { all: '', volumes: {} }; // 解析后的分卷大纲 { all: 框架文本, volumes: {1: '第1卷粗纲', ...} }

const $ = id => document.getElementById(id);

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', () => {
    loadProjects();
    loadUserInfo();
    $('generateBtn').addEventListener('click', startGeneration);
    $('qualityCheckBtn').addEventListener('click', runQualityCheck);
    $('rewriteBtn').addEventListener('click', openRewriteModal);
    $('saveBtn').addEventListener('click', saveChapterEdits);
    $('copyBtn').addEventListener('click', copyChapterContent);
    $('editBtn').addEventListener('click', toggleEditMode);
    $('cancelEditBtn').addEventListener('click', cancelEdit);
    restoreLastProject();
});

async function loadProjects() {
    try {
        const resp = await fetch('/api/novels/list');
        const data = await resp.json();
        const select = $('projectSelect');
        if (data.success && data.data && data.data.length > 0) {
            projects = data.data;
            select.innerHTML = '<option value="">-- 选择项目 --</option>';
            projects.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.title || p.id;
                select.appendChild(opt);
            });
        } else {
            select.innerHTML = '<option value="">-- 无项目 --</option>';
        }
    } catch (e) {
        $('projectSelect').innerHTML = '<option value="">-- 加载失败 --</option>';
        showToast('加载项目失败: ' + e.message, 'error');
    }
}

function restoreLastProject() {
    try {
        const lastPid = localStorage.getItem('lastProjectId');
        const lastVol = localStorage.getItem('lastVolume');
        const lastModel = localStorage.getItem('lastModel');
        const lastStart = localStorage.getItem('lastStartChapter');
        const lastBatch = localStorage.getItem('lastBatchSize');

        if (lastPid && $('projectSelect').querySelector(`option[value="${lastPid}"]`)) {
            $('projectSelect').value = lastPid;
            if (lastVol) $('volumeSelect').value = lastVol;
            if (lastModel && $('modelSelect').querySelector(`option[value="${lastModel}"]`)) {
                $('modelSelect').value = lastModel;
            }
            if (lastStart) $('startChapter').value = lastStart;
            if (lastBatch) $('batchSize').value = lastBatch;
            loadProjectFiles(lastPid, parseInt($('volumeSelect').value));
        }
    } catch (e) {}
}

function saveLastProject() {
    try {
        const pid = $('projectSelect').value;
        if (pid) localStorage.setItem('lastProjectId', pid);
        localStorage.setItem('lastVolume', $('volumeSelect').value);
        localStorage.setItem('lastModel', $('modelSelect').value);
        localStorage.setItem('lastStartChapter', $('startChapter').value);
        localStorage.setItem('lastBatchSize', $('batchSize').value);
    } catch (e) {}
}

// 项目/卷号/模型/章节设置切换时自动保存 + 加载细纲
$('projectSelect').addEventListener('change', async () => {
    const pid = $('projectSelect').value;
    if (pid) await loadProjectFiles(pid, parseInt($('volumeSelect').value));
    saveLastProject();
});
$('volumeSelect').addEventListener('change', async () => {
    const pid = $('projectSelect').value;
    if (pid) await loadProjectFiles(pid, parseInt($('volumeSelect').value));
    saveLastProject();
});
$('modelSelect').addEventListener('change', saveLastProject);
$('startChapter').addEventListener('change', saveLastProject);
$('batchSize').addEventListener('change', saveLastProject);

async function loadProjectFiles(projectId, volumeNumber) {
    try {
        const resp = await fetch('/api/conversation/project-files', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ project_id: projectId, volume_number: volumeNumber })
        });
        const data = await resp.json();
        if (data.success) {
            projectFiles = data;
            // 解析分卷大纲
            parseOutlineVolumes(data.outline || '');
            // 更新或创建参考标签（设定 + 细纲）
            updateReferenceTabs();
            // 如果当前正在显示参考内容，刷新
            if (showingRef) showRefContent();
            // 启用故事线按钮
            updateStorylineBtn();
            // 自动填充起始章节
            if (!data.detailed_outline || !data.detailed_outline.trim()) {
                // 没有细纲，说明还没开始生成，起始章节设为 1
                $('startChapter').value = 1;
            } else if (data.latest_chapter > 0) {
                // 有细纲且有已生成章节，从最新章节+1继续
                $('startChapter').value = data.latest_chapter + 1;
            } else {
                // 有细纲但没有已生成章节，从第1章开始
                $('startChapter').value = 1;
            }
        }
    } catch (e) {
        console.error('加载项目文件失败:', e);
    }
}

// 解析 outline.md 为全书框架 + 各卷粗纲
function parseOutlineVolumes(outlineText) {
    outlineVolumes = { all: outlineText, volumes: {} };
    if (!outlineText) return;

    // 尝试按 "# 各卷粗纲" 或 "---" 分隔符分割
    const splitMarkers = [
        /#{1,3}\s*各卷粗纲/,
        /^---\s*$/m,
    ];

    let frameworkText = outlineText;
    let volumesText = '';

    for (const marker of splitMarkers) {
        const match = outlineText.search(marker);
        if (match !== -1) {
            frameworkText = outlineText.substring(0, match).trim();
            volumesText = outlineText.substring(match).trim();
            break;
        }
    }

    outlineVolumes.all = frameworkText;

    // 从 volumesText 中解析各卷
    if (volumesText) {
        // 匹配 "# 第X卷粗纲" 或 "## 第X卷" 或 "### 第X卷"
        const volRegex = /^#{1,3}\s*第\s*(\d+)\s*卷/g;
        let m;
        const volPositions = [];
        while ((m = volRegex.exec(volumesText)) !== null) {
            volPositions.push({ num: parseInt(m[1], 10), index: m.index });
        }

        for (let i = 0; i < volPositions.length; i++) {
            const start = volPositions[i].index;
            const end = (i + 1 < volPositions.length) ? volPositions[i + 1].index : volumesText.length;
            const volText = volumesText.substring(start, end).trim();
            outlineVolumes.volumes[volPositions[i].num] = volText;
        }
    }

    // 填充卷选择器
    const volSelect = $('outlineVolSelect');
    if (volSelect) {
        volSelect.innerHTML = '<option value="all">全书框架</option>';
        const volKeys = Object.keys(outlineVolumes.volumes).map(Number).sort((a, b) => a - b);
        for (const volNum of volKeys) {
            const opt = document.createElement('option');
            opt.value = String(volNum);
            opt.textContent = `第${volNum}卷粗纲`;
            volSelect.appendChild(opt);
        }
    }
}

// 简单的 Markdown 渲染
function renderMarkdown(text) {
    const lines = text.split('\n');
    let html = '';
    for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) {
            html += '<br>';
            continue;
        }
        if (trimmed.startsWith('# ')) {
            html += `<h3 style="color:var(--text-primary);font-size:16px;margin:14px 0 8px;font-weight:700;">${escapeHtml(trimmed.replace(/^#\s*/, ''))}</h3>`;
        } else if (trimmed.startsWith('## ')) {
            html += `<h4 style="color:var(--accent);font-size:14px;margin:12px 0 6px;font-weight:600;">${escapeHtml(trimmed.replace(/^##\s*/, ''))}</h4>`;
        } else if (trimmed.startsWith('### ')) {
            html += `<h5 style="color:var(--text-secondary);font-size:13px;margin:10px 0 5px;font-weight:600;">${escapeHtml(trimmed.replace(/^###\s*/, ''))}</h5>`;
        } else if (trimmed.startsWith('- ')) {
            html += `<p style="margin-left:16px;color:var(--text-secondary);font-size:13px;">• ${escapeHtml(trimmed.replace(/^-\s*/, ''))}</p>`;
        } else if (trimmed.startsWith('**') && trimmed.endsWith('**')) {
            html += `<p style="font-weight:600;color:var(--text-primary);">${escapeHtml(trimmed.replace(/\*\*/g, ''))}</p>`;
        } else {
            html += `<p>${escapeHtml(trimmed)}</p>`;
        }
    }
    return html;
}

// ===== 开始生成 =====
async function startGeneration() {
    if (isGenerating) return;

    const projectId = $('projectSelect').value;
    const volumeNumber = parseInt($('volumeSelect').value);
    const startChapter = parseInt($('startChapter').value);
    const batchSize = parseInt($('batchSize').value);
    const model = $('modelSelect').value;

    if (!projectId) { showToast('请先选择一个项目', 'error'); return; }

    // 检查当前卷是否有细纲
    if (!projectFiles || !projectFiles.detailed_outline || !projectFiles.detailed_outline.trim()) {
        showToast('当前卷还没有细纲，请先点击【生成本卷细纲】生成细纲后再生成正文', 'error');
        return;
    }

    if (batchSize < 1 || batchSize > 10) { showToast('每批章数应在 1-10 之间', 'error'); return; }

    currentProject = projectId;
    currentVolume = volumeNumber;
    currentBatchStart = startChapter;
    currentBatchEnd = startChapter + batchSize - 1;
    isGenerating = true;
    saveLastProject();

    // 重置 UI
    chapters = {};
    // 同一卷内保持对话上下文，切换卷时才重置
    if (volumeNumber !== lastVolumeSession) {
        sessionMessages = [];
        lastVolumeSession = volumeNumber;
    }
    $('chapterTabs').innerHTML = '';
    $('contentBody').innerHTML = '';
    $('contentBody').classList.add('empty');
    $('contentTitle').textContent = '章节内容';
    $('qualityPanel').style.display = 'none';
    $('thinkingContainer').innerHTML = '';
    $('nextBatchBtn').style.display = 'none';
    qualityReport = null;
    $('qualityPanel').style.display = 'none';
    $('generateBtn').classList.add('running');
    $('generateBtn').disabled = true;
    $('generateBtn').innerHTML = '<span>⏳</span> 生成中...';
    $('qualityCheckBtn').disabled = true;

    // 创建标签页
    for (let i = startChapter; i <= currentBatchEnd; i++) {
        chapters[i] = { title: `第${i}章`, content: '', status: 'pending' };
        createChapterTab(i);
    }
    updateStatus();
    updateProgress();
    
    // 生成开始时，默认显示第一个章节（进入直播模式）
    showChapter(startChapter);

    // 启动 SSE
    try {
        const payload = {
            project_id: projectId,
            volume_number: volumeNumber,
            start_chapter: startChapter,
            batch_size: batchSize,
            model: model,
            messages: sessionMessages
        };

        const resp = await fetch('/api/conversation/generate-batch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        let currentThinking = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split('\n');

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const dataStr = line.slice(6).trim();
                if (!dataStr) continue;
                if (dataStr === '[DONE]') {
                    finalizeGeneration();
                    continue;
                }

                try {
                    const data = JSON.parse(dataStr);
                    if (data.error) {
                        showToast('生成错误: ' + data.error, 'error');
                        isGenerating = false;
                        resetGenerateBtn();
                        return;
                    }
                    if (data.session_messages) {
                        sessionMessages = data.session_messages;
                    }
                    if (data.reasoning) {
                        currentThinking += data.reasoning;
                        updateThinkingDisplay(currentThinking);
                    }
                    if (data.content) {
                        fullText += data.content;
                        parseChaptersFromStream(fullText);
                    }
                } catch (e) {
                    // 忽略解析失败的行
                }
            }
        }

        if (isGenerating) finalizeGeneration();

    } catch (e) {
        showToast('请求失败: ' + e.message, 'error');
        isGenerating = false;
        resetGenerateBtn();
    }
}

// 中文数字转阿拉伯数字
function cnToInt(cn) {
    const map = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'百':100,'千':1000,'万':10000,'亿':100000000};
    if (/^\d+$/.test(cn)) return parseInt(cn);
    let total = 0, temp = 0;
    for (const c of cn) {
        if (map[c] === undefined) continue;
        const n = map[c];
        if (n >= 10) {
            if (temp === 0) temp = 1;
            total += temp * n;
            temp = 0;
        } else {
            temp = temp ? temp * 10 + n : n;
        }
    }
    return total + temp;
}

// ===== 从流文本中解析章节 =====
let _lastLiveUpdate = 0;
function parseChaptersFromStream(text) {
    // 支持阿拉伯数字和中文数字
    const headingRegex = /### 第([一二三四五六七八九十百千万亿\d]+)章\s*(.*?)\n/g;
    const headings = [];
    let m;
    while ((m = headingRegex.exec(text)) !== null) {
        headings.push({
            num: cnToInt(m[1]),
            title: m[2].trim(),
            index: m.index,
            end: m.index + m[0].length
        });
    }

    let latestChNum = null;
    // 提取每个章节的内容
    for (let i = 0; i < headings.length; i++) {
        const h = headings[i];
        const chNum = h.num;
        const startIdx = h.end;
        const endIdx = (i + 1 < headings.length) ? headings[i + 1].index : text.length;
        const content = text.substring(startIdx, endIdx).trim();

        if (chapters[chNum]) {
            const isNewChapter = !chapters[chNum].content;
            chapters[chNum].title = h.title || `第${chNum}章`;
            chapters[chNum].content = content;
            chapters[chNum].status = 'generating';
            updateChapterTab(chNum);
            latestChNum = chNum;
            
            // 新章节出现时，自动切换到该章节（直播跟随）
            if (isNewChapter && isGenerating) {
                showChapter(chNum);
            }
        }
    }
    
    // 节流更新：当前显示章节的实时内容（每200ms最多更新一次，避免频繁重渲染）
    if (latestChNum && isGenerating && activeChapter === latestChNum) {
        const now = Date.now();
        if (now - _lastLiveUpdate > 200) {
            _lastLiveUpdate = now;
            const ch = chapters[latestChNum];
            $('contentTitle').textContent = ch.title;
            // 生成中走同样的段落渲染（不用质检高亮）
            $('contentBody').innerHTML = _paragraphsToHtml(ch.content.split('\n\n').filter(p => p.trim()));
            $('contentBody').scrollTop = $('contentBody').scrollHeight;
        }
    }
    
    updateStatus();
    updateProgress();
}

// ===== 完成生成 =====
function finalizeGeneration() {
    isGenerating = false;
    resetGenerateBtn();
    $('qualityCheckBtn').disabled = false;
    $('nextBatchBtn').style.display = 'flex';
    
    // 将所有 generating 状态标记为 generated，并刷新标签
    for (const chNum in chapters) {
        if (chapters[chNum].status === 'generating') {
            chapters[chNum].status = 'generated';
            updateChapterTab(chNum);
        }
    }

    // 重新渲染当前显示章节（启用高亮质检）
    if (activeChapter && chapters[activeChapter]) {
        showChapter(activeChapter);
    }

    // 自动保存：刷新项目文件，更新 latest_chapter 和起始章节
    const projectId = $('projectSelect').value;
    const volumeNumber = parseInt($('volumeSelect').value);
    if (projectId) {
        loadProjectFiles(projectId, volumeNumber).then(() => {
            const savedCount = Object.values(chapters).filter(c => c.status === 'generated').length;
            showToast(`✅ 批次生成完成，${savedCount} 章已自动保存`, 'success');
        }).catch(() => {
            showToast('✅ 批次生成完成', 'success');
        });
    } else {
        showToast('✅ 批次生成完成', 'success');
    }
}

function showChapter(chNum) {
    showingRef = false;
    currentRefType = '';
    isEditMode = false;
    activeChapter = chNum;

    document.querySelectorAll('.chapter-tab').forEach(t => t.classList.remove('active'));

    $('rewriteBtn').disabled = false;
    $('saveBtn').disabled = false;

// 常见引号 Unicode
const DIALOGUE_RE = /^[\u201C\u201D\u0022\u300C\u300E]/;

function _paragraphsToHtml(paragraphs) {
    return paragraphs.map(p => {
        const isDialogue = DIALOGUE_RE.test(p);
        const isShort = p.length <= 15;
        let cls = '';
        if (isDialogue) cls = 'dialogue';
        else if (isShort) cls = 'short';
        return `<p class="${cls}">${escapeHtml(p)}</p>`;
    }).join('\n');
}

// ===== 渲染章节内容，高亮质检问题 =====
function renderChapterWithHighlights(content, chNum) {
    // 网文段落不做合并，保持AI原样（短段落是番茄风格）
    const paragraphs = content.split('\n\n').filter(p => p.trim());
    let html = _paragraphsToHtml(paragraphs);

    // 如果有质检报告，高亮当前章节的问题文字
    if (qualityReport && qualityReport.issues) {
        const chapterIssues = qualityReport.issues.filter(i => (i.chapter || '').toString() === chNum.toString());
        for (const issue of chapterIssues) {
            const highlights = issue.highlights || [];
            for (const hl of highlights) {
                if (!hl.trim()) continue;
                const safeHl = escapeHtml(hl);
                const color = issue.severity === 'critical' ? '#ef4444' : (issue.severity === 'warning' ? '#f59e0b' : '#3b82f6');
                const bg = issue.severity === 'critical' ? 'rgba(239,68,68,0.15)' : (issue.severity === 'warning' ? 'rgba(245,158,11,0.12)' : 'rgba(59,130,246,0.1)');
                // 用 mark 标签高亮，并添加 tooltip
                const markHtml = `<mark style="background:${bg};color:${color};border-radius:3px;padding:1px 3px;cursor:pointer;" title="${escapeHtml(issue.category || '')}: ${escapeHtml(issue.description || '')}" onclick="showIssueTip(this)">${safeHl}</mark>`;
                html = html.replaceAll(safeHl, markHtml);
            }
        }
    }
    return html;
}

function showIssueTip(el) {
    showToast(el.getAttribute('title'), 'info');
}

// ===== 从质检问题直接重写 =====
function rewriteFromIssue(issueIdx) {
    if (!qualityReport || !qualityReport.issues[issueIdx]) return;
    const issue = qualityReport.issues[issueIdx];
    const chNum = issue.chapter;
    if (!chNum || !chapters[chNum]) {
        showToast('该章节尚未生成', 'error');
        return;
    }
    activeChapter = parseInt(chNum);
    showChapter(activeChapter);

    // 构建重写指令
    let instruction = `【质检发现的问题】\n类型：${issue.category || '其他'}\n严重程度：${issue.severity || 'warning'}\n问题描述：${issue.description || ''}`;
    if (issue.fix_suggestion) {
        instruction += `\n修改建议：${issue.fix_suggestion}`;
    }
    const highlights = issue.highlights || [];
    if (highlights.length > 0) {
        instruction += `\n问题文字："${highlights.join('"、"')}"`;
    }
    instruction += '\n\n请根据以上问题重写本章，确保修复所有问题。';

    $('rewriteChapterNum').textContent = chNum;
    $('rewriteInstruction').value = instruction;
    $('rewriteModal').classList.add('show');
}

// ===== 更新状态 =====
function updateStatus() {
    const total = Object.keys(chapters).length;
    const done = Object.values(chapters).filter(c => c.status === 'generated').length;
    const generating = Object.values(chapters).filter(c => c.status === 'generating').length;

    if (isGenerating) {
        $('statusText').textContent = '生成中...';
        $('statusText').className = 'val warning';
    } else if (done > 0) {
        $('statusText').textContent = '已完成';
        $('statusText').className = 'val success';
    } else {
        $('statusText').textContent = '未开始';
        $('statusText').className = 'val';
    }

    $('generatedCount').textContent = `${done} / ${total}`;

    // 找到当前正在生成的章节
    let currentCh = '-';
    for (let n = currentBatchStart; n <= currentBatchEnd; n++) {
        if (chapters[n] && chapters[n].status === 'pending' && currentCh === '-') {
            currentCh = `第${n}章`;
            break;
        }
    }
    if (generating > 0) {
        const g = Object.entries(chapters).find(([k, v]) => v.status === 'generating');
        if (g) currentCh = `第${g[0]}章`;
    }
    $('currentChapterText').textContent = currentCh;
}

function updateProgress() {
    const total = Object.keys(chapters).length;
    const done = Object.values(chapters).filter(c => c.status === 'generated').length;
    const pct = total > 0 ? (done / total * 100) : 0;
    $('progressFill').style.width = pct + '%';
}

async function runQualityCheck() {
    if (!currentProject) { showToast('请先完成生成', 'error'); return; }

    $('qualityCheckBtn').disabled = true;
    $('qualityCheckBtn').innerHTML = '<span>⏳</span> 质检中...';

    try {
        const resp = await fetch('/api/conversation/align-check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                project_id: currentProject,
                volume_number: currentVolume,
                start_chapter: currentBatchStart,
                end_chapter: currentBatchEnd,
                model: $('modelSelect').value
            })
        });

        const data = await resp.json();
        if (data.success) {
            renderQualityReport(data.report);
            showToast('✅ 质检完成', 'success');
        } else {
            showToast('质检失败: ' + (data.error || '未知错误'), 'error');
        }
    } catch (e) {
        showToast('质检请求失败: ' + e.message, 'error');
    } finally {
        $('qualityCheckBtn').disabled = false;
        $('qualityCheckBtn').innerHTML = '<span>🔍</span> 对齐质检';
    }
}

function renderQualityReport(report) {
    qualityReport = report; // 保存到全局，供高亮和重写使用
    $('qualityPanel').style.display = 'block';

    const passed = report.passed;
    const score = report.overall_score || 0;
    const issues = report.issues || [];
    const summary = report.summary || '';

    let scoreClass = 'low';
    if (score >= 80) scoreClass = 'high';
    else if (score >= 60) scoreClass = 'mid';

    let summaryHtml = '';
    if (summary) {
        summaryHtml = `<div style="font-size:11px;color:var(--text-secondary);margin-bottom:10px;line-height:1.6;padding:8px;background:var(--bg-tertiary);border-radius:var(--radius-sm);border:1px solid var(--border-color);">${escapeHtml(summary)}</div>`;
    }

    $('qualitySummary').innerHTML = `
        <div class="quality-score">
            <div class="score-val ${scoreClass}">${score}</div>
            <div class="score-label">总分</div>
        </div>
        <div class="quality-result ${passed ? 'pass' : 'fail'}">
            ${passed ? '✅ 通过' : '❌ 未通过'}
        </div>
    `;

    const list = $('issueList');
    if (issues.length === 0) {
        list.innerHTML = '<li style="color:var(--success);font-size:12px;">✅ 未发现问题</li>';
    } else {
        list.innerHTML = summaryHtml + issues.map((issue, idx) => {
            const highlights = issue.highlights || [];
            const hlHtml = highlights.length > 0
                ? `<div style="margin-top:4px;font-size:10px;color:var(--text-muted);">🔍 相关文字：${highlights.map(h => `<span style="color:var(--error);font-weight:600;">"${escapeHtml(h)}"</span>`).join('、')}</div>`
                : '';
            return `
            <li class="issue-item" data-ch="${issue.chapter || ''}" data-idx="${idx}">
                <div class="issue-header">
                    <span class="issue-badge ${issue.severity || 'warning'}">${issue.severity || 'warning'}</span>
                    <span class="issue-badge cat">${issue.category || '其他'}</span>
                    <span style="color:var(--text-muted);">第${issue.chapter || '?'}章</span>
                </div>
                <div class="issue-desc">${escapeHtml(issue.description || '')}</div>
                ${issue.fix_suggestion ? `<div class="issue-fix">💡 ${escapeHtml(issue.fix_suggestion)}</div>` : ''}
                ${hlHtml}
                <div style="margin-top:6px;text-align:right;">
                    <button class="gen-btn secondary" style="width:auto;padding:3px 10px;font-size:10px;" onclick="rewriteFromIssue(${idx})">🔄 重写修复</button>
                </div>
            </li>
        `}).join('');
    }

    // 刷新当前章节显示，应用高亮
    if (activeChapter) showChapter(activeChapter);

    $('qualityPanel').scrollIntoView({ behavior: 'smooth' });
}

function openRewriteModal() {

async function confirmRewrite() {
    const chNum = activeChapter;
    const instruction = $('rewriteInstruction').value.trim();
    if (!chNum) return;

    closeRewriteModal();
    showToast(`🔄 开始重写第${chNum}章...`, 'info');

    chapters[chNum].status = 'generating';
    chapters[chNum].content = '';
    updateChapterTab(chNum);
    showChapter(chNum);

    try {
        const payload = {
            project_id: currentProject,
            volume_number: currentVolume,
            start_chapter: chNum,
            batch_size: 1,
            model: $('modelSelect').value,
            messages: [
                ...sessionMessages,
                { role: 'user', content: `请重写第${chNum}章。修改要求：${instruction || '请优化本章质量，增强爽点，修正问题。'}` }
            ]
        };

        const resp = await fetch('/api/conversation/generate-batch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        let _rewriteLastUpdate = 0;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split('\n');
            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const dataStr = line.slice(6).trim();
                if (!dataStr || dataStr === '[DONE]') continue;
                try {
                    const data = JSON.parse(dataStr);
                    if (data.content) {
                        fullText += data.content;
                        // 实时解析并显示（节流 200ms）
                        const now = Date.now();
                        if (now - _rewriteLastUpdate > 200) {
                            _rewriteLastUpdate = now;
                            const regex = /### 第([一二三四五六七八九十百千万亿\d]+)章\s*(.*?)\n/;
                            const match = regex.exec(fullText);
                            if (match) {
                                chapters[chNum].title = match[2].trim() || `第${chNum}章`;
                                chapters[chNum].content = fullText.substring(match.index + match[0].length).trim();
                                if (activeChapter === chNum) {
                                    $('contentTitle').textContent = chapters[chNum].title;
                                    $('contentBody').innerHTML = _paragraphsToHtml(chapters[chNum].content.split('\n\n').filter(p => p.trim()));
                                    $('contentBody').scrollTop = $('contentBody').scrollHeight;
                                }
                            }
                        }
                    }
                } catch (e) {}
            }
        }

        // 最终解析重写结果（支持中文数字）
        const regex = /### 第([一二三四五六七八九十百千万亿\d]+)章\s*(.*?)\n/;
        const match = regex.exec(fullText);
        if (match) {
            const title = match[2].trim();
            const content = fullText.substring(match.index + match[0].length).trim();
            chapters[chNum].title = title || `第${chNum}章`;
            chapters[chNum].content = content;
        } else {
            chapters[chNum].content = fullText;
        }
        chapters[chNum].status = 'generated';
        updateChapterTab(chNum);
        showChapter(chNum);
        showToast('✅ 重写完成', 'success');
    } catch (e) {
        chapters[chNum].status = 'failed';
        updateChapterTab(chNum);
        showToast('重写失败: ' + e.message, 'error');
    }
}

function parseStoryline(markdown) {
    if (!markdown) return [];
    const chapters = [];
    // 支持1-3级markdown标题，兼容各种格式
    const chapterRegex = /^#{1,3}\s*第\s*(\d+)\s*章(?:[\s:：]+(.+?))?$/gm;
    let match;
    const positions = [];
    while ((match = chapterRegex.exec(markdown)) !== null) {
        positions.push({ index: match.index, num: parseInt(match[1]), title: match[2].trim() });
    }
    for (let i = 0; i < positions.length; i++) {
        const start = positions[i].index;
        const end = positions[i + 1] ? positions[i + 1].index : markdown.length;
        const block = markdown.slice(start, end);
        const ch = { num: positions[i].num, title: positions[i].title };
        const extract = (label) => {
            const r = new RegExp('\\*\\*' + label + '\\*\\*[：:]\\s*(.+?)(?=\\n\\*\\*|\\n#{1,3}|\\s*$)', 's');
            const m = block.match(r);
            return m ? m[1].trim() : '';
        };
        ch.scene = extract('场景设定');
        const charsRaw = extract('涉及角色');
        ch.characters = charsRaw ? charsRaw.split(/[,，、/]/).map(s => s.trim()).filter(Boolean) : [];
        ch.hook = extract('核心爽点/猎奇点') || extract('核心爽点');
        ch.steps = [];
        const stepsMatch = block.match(/\*\*情节步骤\*\*[：:]?\s*([\s\S]*?)(?=\n\*\*|\n#{1,3}|\s*$)/);
        if (stepsMatch) {
            const stepLines = stepsMatch[1].split('\n');
            for (const line of stepLines) {
                const m = line.match(/^\s*\d+[.．]\s*(.+)$/);
                if (m) ch.steps.push(m[1].trim());
            }
        }
        ch.dialogues = [];
        const dlgMatch = block.match(/\*\*关键对话\*\*[：:]?\s*([\s\S]*?)(?=\n\*\*|\n#{1,3}|\s*$)/);
        if (dlgMatch) {
            const dlgLines = dlgMatch[1].split('\n');
            for (const line of dlgLines) {
                const m = line.match(/^\s*[-•]\s*["\'](.+)["\']$/);
                if (m) ch.dialogues.push(m[1].trim());
            }
        }
        ch.climaxDesign = extract('爽点设计说明') || extract('爽点设计');
        ch.endingHook = extract('章节结尾钩子') || extract('结尾钩子');
        ch.emotion = extract('情绪曲线') || extract('情绪走向');
        ch.wordCount = extract('预计字数') || extract('预估字数');
        chapters.push(ch);
    }
    return chapters;
}

// 从项目设定中提取角色外貌描述
function extractCharacterAppearance(characterName) {
    if (!projectFiles || !projectFiles.settings || !characterName) return '';
    const settings = projectFiles.settings;

    // 策略1: 搜索角色名附近的"外貌"、"长相"、"形象"关键词
    const nameIdx = settings.indexOf(characterName);
    if (nameIdx === -1) return '';

    // 向前向后各取500字符
    const start = Math.max(0, nameIdx - 300);
    const end = Math.min(settings.length, nameIdx + 500);
    const context = settings.slice(start, end);

    // 尝试匹配常见格式
    const patterns = [
        new RegExp(characterName + '[：:：]\\s*([^\\n]{10,200})', 'i'),
        /外貌[：:：]\s*([^\n]{10,200})/i,
        /长相[：:：]\s*([^\n]{10,200})/i,
        /形象[：:：]\s*([^\n]{10,200})/i,
        /面容[：:：]\s*([^\n]{10,200})/i,
        /外观[：:：]\s*([^\n]{10,200})/i,
    ];
    for (const p of patterns) {
        const m = context.match(p);
        if (m) return m[1].trim();
    }
    return '';
}

// 清洗角色名，去掉括号标注如"（首次出场）"
function cleanCharacterName(name) {
    if (!name) return '';
    return name.replace(/[（(].*?[）)]/g, '').trim();

// 从项目设定中检测小说类型，返回 prompt 前缀和约束

    if (!projectFiles || !projectFiles.settings) return {
        genre: 'modern',
        scenePrefix: '现代都市小说场景',
        charPrefix: '现代都市小说角色',
        styleHint: '真实照片质感，自然光影，写实风格',
        negHint: '不科幻不古装不仙侠不动漫',
        defaultDesc: '现代日常穿搭，都市气质，真实人像'
    };
    const text = projectFiles.settings.slice(0, 2000);
    const low = text.toLowerCase();

    const genres = [
        {
            keys: ['修仙', '玄幻', '仙侠', '修真', '金丹', '元婴', '灵气', '法宝', '渡劫', '魔道', '剑修'],
            genre: 'xianxia',
            scenePrefix: '古风仙侠小说场景',
            charPrefix: '古风仙侠小说角色',
            styleHint: '国漫风格，唯美细腻',
            negHint: '不现代不科幻',
            defaultDesc: '古风服饰，飘逸长发，仙气飘飘'
        },
        {
            keys: ['科幻', '星际', '机甲', '未来', '赛博', '末世', '基因', '量子', '飞船'],
            genre: 'scifi',
            scenePrefix: '科幻小说场景',
            charPrefix: '科幻小说角色',
            styleHint: '未来感，电影截图',
            negHint: '不古风不现代日常',
            defaultDesc: '未来感服装，科技元素，冷峻气质'
        },
        {
            keys: ['悬疑', '推理', '刑侦', '探案', '犯罪', '惊悚', '法医', '谍战'],
            genre: 'suspense',
            scenePrefix: '悬疑小说场景',
            charPrefix: '悬疑小说角色',
            styleHint: '写实暗调，电影感',
            negHint: '不科幻不古装不唯美',
            defaultDesc: '写实风格，眼神有戏，气质沉稳'
        },
        {
            keys: ['言情', '甜宠', '虐恋', '霸总', '千金', '婚恋', '竹马'],
            genre: 'romance',
            scenePrefix: '浪漫言情小说场景',
            charPrefix: '浪漫言情小说角色',
            styleHint: '唯美柔和，韩剧风格',
            negHint: '不科幻不古装不暗调',
            defaultDesc: '时尚精致，气质优雅，柔和光影'
        },
        {
            keys: ['历史', '架空', '王朝', '皇帝', '宫斗', '权谋', '诸侯'],
            genre: 'history',
            scenePrefix: '历史架空小说场景',
            charPrefix: '历史架空小说角色',
            styleHint: '古风写实，历史质感',
            negHint: '不现代不科幻',
            defaultDesc: '古代服饰，仪态端庄，历史质感'
        },
    ];

    for (const g of genres) {
        if (g.keys.some(k => text.includes(k) || low.includes(k))) return g;
    }
    // 默认现代都市
    return {
        genre: 'modern',
        scenePrefix: '现代都市小说场景',
        charPrefix: '现代都市小说角色',
        styleHint: '真实照片质感，自然光影，写实风格',
        negHint: '不科幻不古装不仙侠不动漫',
        defaultDesc: '现代日常穿搭，都市气质，真实人像'
    };
}

// 构造场景图prompt
function buildScenePrompt(sceneText) {
    if (!sceneText) return '';
    const g = detectNovelStyle();
    return `${g.scenePrefix}：${sceneText}，${g.styleHint}，${g.negHint}`;
}

// 构造角色图prompt
function buildCharacterPrompt(characterName) {
    const cleanName = cleanCharacterName(characterName);
    if (!cleanName) return '';
    const appearance = extractCharacterAppearance(cleanName);
    const g = detectNovelStyle();
    const desc = appearance || g.defaultDesc;
    return `${g.charPrefix}「${cleanName}」：${desc}，${g.styleHint}，${g.negHint}`;
}

// 显示剧照生成模态框
function showStillModal(chNum, type, name) {
    stillModalState = { chNum, type, name };
    const titleEl = document.getElementById('stillModalTitle');
    const promptEl = document.getElementById('stillPrompt');
    const ch = storylineData.find(c => c.num === chNum);

    if (type === 'scene') {
        titleEl.textContent = `🎬 生成第${chNum}章场景图`;
        promptEl.value = buildScenePrompt(ch ? ch.scene : '');
    } else {
        const cleanName = cleanCharacterName(name);
        titleEl.textContent = `👤 生成「${cleanName}」角色图`;
        promptEl.value = buildCharacterPrompt(name);
    }

    document.getElementById('stillGenerateBtn').disabled = false;
    document.getElementById('stillGenerateBtn').textContent = '生成';
    document.getElementById('stillModal').classList.add('show');
}

function closeStillModal() {
    document.getElementById('stillModal').classList.remove('show');
    stillModalState = { chNum: null, type: null, name: null };
}

// 确认生成剧照
async function confirmGenerateStill() {
    const { chNum, type, name } = stillModalState;
    if (!chNum || !type) return;

    const prompt = document.getElementById('stillPrompt').value.trim();
    if (!prompt) { showToast('请输入提示词', 'error'); return; }

    const btn = document.getElementById('stillGenerateBtn');
    btn.disabled = true;
    btn.textContent = '⏳ 生成中...';

    try {
        const response = await fetch('/api/storyline/generate-still', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                project_id: currentProject || document.getElementById('projectSelect').value,
                chapter_num: chNum,
                image_type: type,
                prompt: prompt,
                character_name: type === 'character' ? name : null,
                aspect_ratio: type === 'scene' ? '16:9' : '9:16',
                novel_title: currentProject
            })
        });

        const data = await response.json();
        if (data.success) {
            storylineStills.push(data.data);
            renderStillsInStoryline();
            showToast('✅ 剧照生成成功', 'success');
            closeStillModal();
        } else {
            showToast('生成失败: ' + (data.error || '未知错误'), 'error');
            btn.disabled = false;
            btn.textContent = '生成';
        }
    } catch (e) {
        showToast('请求失败: ' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = '生成';
    }
}

// 加载某项目的所有故事线剧照
async function loadStorylineStills(projectId) {
    if (!projectId) return;
    try {
        const resp = await fetch(`/api/storyline/stills?project_id=${encodeURIComponent(projectId)}&limit=200`);
        const data = await resp.json();
        if (data.success) {
            storylineStills = data.data;
            renderStillsInStoryline();
        }
    } catch (e) {
        console.error('加载剧照失败:', e);
    }
}

// 在故事线中渲染已加载的剧照
function renderStillsInStoryline() {
    if (!showingStoryline) return;

    for (const still of storylineStills) {
        const meta = still.metadata || {};
        const chNum = meta.chapter_num;
        const type = still.image_type;
        if (!chNum || !type) continue;

        let containerId;
        if (type === 'scene') {
            containerId = 'still-scene-ch' + chNum;
        } else if (type === 'character') {
            containerId = 'still-char-ch' + chNum;
        } else {
            continue;
        }

        const container = document.getElementById(containerId);
        if (!container) continue;

        // 检查是否已渲染（避免重复）
        if (container.querySelector(`[data-image-id="${still.image_id}"]`)) continue;

        const img = document.createElement('img');
        img.src = still.image_url;
        img.className = 'still-image-thumb';
        img.title = still.prompt;
        img.dataset.imageId = still.image_id;
        img.onclick = () => window.open(still.image_url, '_blank');
        container.appendChild(img);
    }
}
