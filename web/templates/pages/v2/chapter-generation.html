<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姝ｆ枃鐢熸垚 - NovelCraft</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">
    <script>
        (function(){var t=localStorage.getItem('v2-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
    </script>
    <script src="/static/js/v2-theme.js"></script>
    <style>
        :root {
            --bg-primary: #0d0d12;
            --bg-secondary: #16161c;
            --bg-tertiary: #22222a;
            --bg-message: #1c1c24;
            --border-color: rgba(255,255,255,0.10);
            --border-light: rgba(255,255,255,0.06);
            --text-primary: #e2e2e8;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent: #8b5cf6;
            --accent-dim: rgba(139,92,246,0.15);
            --accent-border: rgba(139,92,246,0.3);
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --glow: 0 0 20px rgba(139,92,246,0.15);
            --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
        }
        
        html[data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f1f3f4;
            --bg-message: #f8f9fa;
            --border-color: #e5e7eb;
            --border-light: #f1f3f4;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --accent-dim: rgba(139,92,246,0.1);
            --accent-border: rgba(139,92,246,0.25);
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --glow: 0 0 20px rgba(139,92,246,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 15px;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* ===== 椤堕儴瀵艰埅 ===== */
        .top-nav {
            height: 56px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }
        .nav-left { display: flex; align-items: center; gap: 16px; }
        .nav-logo {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 4px; }
        .nav-links a {
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
        }
        .nav-links a:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .nav-links a.active { background: rgba(139,92,246,0.15); color: #a78bfa; }

        .nav-right { display: flex; align-items: center; gap: 10px; }
        .nav-model-select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
        }
        .nav-user { font-size: 12px; color: var(--text-secondary); }

        /* ===== 涓讳綋甯冨眬 ===== */
        .main-wrapper {
            height: calc(100vh - 56px);
            display: grid;
            grid-template-columns: 260px 1fr 300px;
            overflow: hidden;
        }

        /* ===== 宸︿晶闈㈡澘 ===== */
        .left-panel {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .config-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px;
            transition: border-color 0.2s;
        }
        .config-card:hover { border-color: var(--border-hover); }
        .config-card h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group:last-child { margin-bottom: 0; }
        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .form-group select,
        .form-group input[type="number"] {
            width: 100%;
            padding: 8px 11px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group select:focus,
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .gen-btn {
            width: 100%;
            padding: 10px 14px;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            letter-spacing: 0.5px;
        }
        .gen-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--glow); filter: brightness(1.1); }
        .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .gen-btn.running {
            background: linear-gradient(135deg, var(--warning), #d97706);
            animation: btnPulse 2s infinite;
        }
        @keyframes btnPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        .gen-btn.secondary {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .gen-btn.secondary:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: none;
            filter: none;
        }

        .status-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px;
            font-size: 11px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .status-row:last-child { margin-bottom: 0; }
        .status-row .val {
            font-weight: 600;
            color: var(--text-primary);
            font-family: var(--font-mono);
        }
        .status-row .val.success { color: var(--success); }
        .status-row .val.error { color: var(--error); }
        .status-row .val.warning { color: var(--warning); }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: var(--bg-primary);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #a78bfa);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* ===== 鏁呬簨绾胯鍥撅紙鍦ㄥ彸渚ф鏂囧尯鍩熷睍绀猴級 ===== */
        .storyline-view {
            padding: 24px 32px;
            overflow-y: auto;
            flex: 1;
        }
        .storyline-view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .storyline-view-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .storyline-back-btn {
            padding: 6px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .storyline-back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .storyline-big-timeline {
            position: relative;
            padding-left: 32px;
            max-width: 900px;
            margin: 0 auto;
        }
        .storyline-big-timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 12px;
            bottom: 12px;
            width: 3px;
            background: linear-gradient(to bottom, var(--accent), rgba(139,92,246,0.15));
            border-radius: 2px;
        }
        .storyline-big-node {
            position: relative;
            margin-bottom: 28px;
            padding: 20px 24px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .storyline-big-node:hover {
            border-color: var(--accent-border);
            box-shadow: var(--glow);
        }
        .storyline-big-node:last-child { margin-bottom: 0; }
        .storyline-big-dot {
            position: absolute;
            left: -30px;
            top: 24px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 3px solid var(--bg-primary);
            box-shadow: 0 0 0 2px var(--accent-border);
            z-index: 1;
        }
        .storyline-big-dot.hook { background: var(--warning); box-shadow: 0 0 0 2px rgba(245,158,11,0.4); }
        .storyline-big-dot.climax { background: var(--error); box-shadow: 0 0 0 2px rgba(239,68,68,0.4); }
        .storyline-big-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            transition: color 0.2s;
            margin-bottom: 12px;
        }
        .storyline-big-title:hover { color: var(--accent); }
        .storyline-big-title .ch-num {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            margin-right: 6px;
        }
        .storyline-big-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .storyline-big-section {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
        }
        .storyline-big-section.full { grid-column: 1 / -1; }
        .storyline-big-section h4 {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .storyline-big-section p {
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.6;
        }
        .storyline-big-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .storyline-big-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
        }
        .storyline-big-tag:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .storyline-big-tag.char {
            background: rgba(59,130,246,0.12);
            color: #60a5fa;
        }
        .storyline-big-tag.hook {
            background: rgba(245,158,11,0.15);
            color: #b45309;
        }
        .storyline-big-tag.scene {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }
        .storyline-big-tag.emotion {
            background: rgba(236,72,153,0.12);
            color: #f472b6;
        }
        .storyline-big-steps {
            padding-left: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .storyline-big-steps li { margin-bottom: 4px; }
        .storyline-big-dialogues {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .storyline-big-dialogue {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 6px 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            border-left: 2px solid var(--accent);
        }
        .storyline-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 20px;
            font-size: 14px;
        }

        /* ===== 鍙充晶闈㈡澘 ===== */
        .right-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 鍙傝€冧晶婊戦潰鏉?*/
        .ref-drawer {
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 55%;
            min-width: 380px;
            max-width: 600px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 32px rgba(0,0,0,0.3);
        }
        .ref-drawer.open {
            transform: translateX(0);
        }
        .ref-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-tertiary);
        }
        .ref-tabs {
            display: flex;
            gap: 4px;
        }
        .ref-tab-btn {
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
        }
        .ref-tab-btn:hover { color: var(--text-primary); background: var(--bg-primary); }
        .ref-tab-btn.active {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent-border);
        }
        .ref-drawer-close {
            width: 28px; height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ref-drawer-close:hover { background: var(--bg-primary); color: var(--text-primary); }
        .ref-drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            font-size: 13px;
            line-height: 1.7;
        }
        .ref-drawer-body h1, .ref-drawer-body h2, .ref-drawer-body h3 {
            margin: 16px 0 10px;
            color: var(--text-primary);
        }
        .ref-drawer-body p { margin: 8px 0; color: var(--text-secondary); }
        .ref-drawer-body ul, .ref-drawer-body ol { margin: 8px 0; padding-left: 20px; }
        .ref-drawer-body li { margin: 4px 0; color: var(--text-secondary); }
        .ref-drawer-body code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--accent);
        }
        .ref-drawer-body blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            margin: 10px 0;
            color: var(--text-muted);
        }
        .ref-drawer-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 12px;
        }
        .ref-drawer-body th, .ref-drawer-body td {
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            text-align: left;
        }
        .ref-drawer-body th {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ===== 鍙充晶缁嗙翰闈㈡澘 ===== */
        .outline-panel {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .outline-panel-header {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-tertiary);
        }
        .outline-panel-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .outline-panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .outline-field {
            margin-bottom: 12px;
        }
        .outline-field label {
            display: block;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .outline-field textarea {
            width: 100%;
            padding: 8px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
            line-height: 1.6;
            font-family: inherit;
            resize: vertical;
            outline: none;
            min-height: 36px;
        }
        .outline-field textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-dim);
        }
        .outline-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .outline-tag {
            padding: 2px 8px;
            background: var(--accent-dim);
            border: 1px solid var(--accent-border);
            border-radius: 4px;
            font-size: 11px;
            color: var(--accent);
        }
        .outline-steps {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .outline-steps div {
            margin-bottom: 2px;
        }
        .outline-empty {
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            padding: 20px 0;
        }
        .outline-save-hint {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            padding: 8px 0;
        }
        .outline-md-render {
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-secondary);
        }
        .outline-md-render h3 {
            font-size: 14px;
            color: var(--text-primary);
            margin: 10px 0 6px;
            font-weight: 600;
        }
        .outline-md-render h4 {
            font-size: 13px;
            color: var(--accent);
            margin: 8px 0 4px;
            font-weight: 600;
        }
        .outline-md-render p {
            margin: 4px 0;
        }
        .outline-edit-textarea {
            width: 100%;
            min-height: 500px;
            padding: 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.7;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }
        .outline-edit-textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-dim);
        }

        .chapter-tabs {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 6px;
            flex-shrink: 0;
        }
        .chapter-tab-container {
            display: flex;
            gap: 4px;
            overflow: hidden;
            flex: 1;
        }
        .tab-scroll-btn {
            width: 24px;
            height: 28px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .tab-scroll-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .tab-scroll-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .tab-page-info {
            font-size: 11px;
            color: var(--text-muted);
            padding: 0 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .chapter-tab {
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }
        .chapter-tab:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .chapter-tab.active {
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent-border);
        }
        .chapter-tab .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .chapter-tab .dot.pending { background: var(--text-muted); }
        .chapter-tab .dot.generating { background: var(--warning); animation: pulse 1.2s infinite; }
        .chapter-tab .dot.generated { background: var(--success); }
        .chapter-tab .dot.failed { background: var(--error); }

// 瑙ｆ瀽 outline.md 涓哄叏涔︽鏋?+ 鍚勫嵎绮楃翰
function parseOutlineVolumes(outlineText) {
    outlineVolumes = { all: outlineText, volumes: {} };
    if (!outlineText) return;

    // 灏濊瘯鎸?"# 鍚勫嵎绮楃翰" 鎴?"---" 鍒嗛殧绗﹀垎鍓?    const splitMarkers = [
        /#{1,3}\s*鍚勫嵎绮楃翰/,
        /^---\s*$/m,
    ];

    let frameworkText = outlineText;
    let volumesText = '';

    for (const marker of splitMarkers) {
        const match = outlineText.search(marker);
        if (match !== -1) {
            frameworkText = outlineText.substring(0, match).trim();
            volumesText = outlineText.substring(match).trim();
            break;
        }
    }

    outlineVolumes.all = frameworkText;

    // 浠?volumesText 涓В鏋愬悇鍗?    if (volumesText) {
        // 鍖归厤 "# 绗琗鍗风矖绾? 鎴?"## 绗琗鍗? 鎴?"### 绗琗鍗?
        const volRegex = /^#{1,3}\s*绗琝s*(\d+)\s*鍗?g;
        let m;
        const volPositions = [];
        while ((m = volRegex.exec(volumesText)) !== null) {
            volPositions.push({ num: parseInt(m[1], 10), index: m.index });
        }

        for (let i = 0; i < volPositions.length; i++) {
            const start = volPositions[i].index;
            const end = (i + 1 < volPositions.length) ? volPositions[i + 1].index : volumesText.length;
            const volText = volumesText.substring(start, end).trim();
            outlineVolumes.volumes[volPositions[i].num] = volText;
        }
    }

    // 濉厖鍗烽€夋嫨鍣?    const volSelect = $('outlineVolSelect');
    if (volSelect) {
        volSelect.innerHTML = '<option value="all">鍏ㄤ功妗嗘灦</option>';
        const volKeys = Object.keys(outlineVolumes.volumes).map(Number).sort((a, b) => a - b);
        for (const volNum of volKeys) {
            const opt = document.createElement('option');
            opt.value = String(volNum);
            opt.textContent = `绗?{volNum}鍗风矖绾瞏;
            volSelect.appendChild(opt);
        }
    }
}

// 绠€鍗曠殑 Markdown 娓叉煋
function renderMarkdown(text) {
    const lines = text.split('\n');
    let html = '';
    for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) {
            html += '<br>';
            continue;
        }
        // 鍏堝鐞嗚鍐?**绮椾綋**
        let processed = escapeHtml(trimmed);
        processed = processed.replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--text-primary);">$1</strong>');

        if (trimmed.startsWith('# ')) {
            html += '<h3 style="color:var(--text-primary);font-size:16px;margin:14px 0 8px;font-weight:700;">' + processed.replace(/^#\s*/, '') + '</h3>';
        } else if (trimmed.startsWith('## ')) {
            html += '<h4 style="color:var(--accent);font-size:14px;margin:12px 0 6px;font-weight:600;">' + processed.replace(/^##\s*/, '') + '</h4>';
        } else if (trimmed.startsWith('### ')) {
            html += '<h5 style="color:var(--text-secondary);font-size:13px;margin:10px 0 5px;font-weight:600;">' + processed.replace(/^###\s*/, '') + '</h5>';
        } else if (trimmed.startsWith('- ')) {
            html += '<p style="margin-left:16px;color:var(--text-secondary);font-size:13px;">鈥?' + processed.replace(/^-\s*/, '') + '</p>';
        } else if (/^\d+[\.锛嶿\s/.test(trimmed)) {
            html += '<p style="margin-left:16px;color:var(--text-secondary);font-size:13px;">' + processed + '</p>';
        } else {
            html += '<p>' + processed + '</p>';
        }
    }
    return html;
}

    // 妫€鏌ュ綋鍓嶅嵎鏄惁鏈夌粏绾?    if (!projectFiles || !projectFiles.detailed_outline || !projectFiles.detailed_outline.trim()) {
        showToast('褰撳墠鍗疯繕娌℃湁缁嗙翰锛岃鍏堢偣鍑汇€愮敓鎴愭湰鍗风粏绾层€戠敓鎴愮粏绾插悗鍐嶇敓鎴愭鏂?, 'error');
        return;
    }

    if (batchSize < 1 || batchSize > 10) { showToast('姣忔壒绔犳暟搴斿湪 1-10 涔嬮棿', 'error'); return; }

    currentProject = projectId;
    currentVolume = volumeNumber;
    currentBatchStart = startChapter;
    currentBatchEnd = startChapter + batchSize - 1;
    isGenerating = true;
    saveLastProject();

    // 閲嶇疆 UI
    chapters = {};
    // 鍚屼竴鍗峰唴淇濇寔瀵硅瘽涓婁笅鏂囷紝鍒囨崲鍗锋椂鎵嶉噸缃?    if (volumeNumber !== lastVolumeSession) {
        sessionMessages = [];
        lastVolumeSession = volumeNumber;
    }
    $('tabTabContainer').innerHTML = '';
    $('contentBody').innerHTML = '';
    $('contentBody').classList.add('empty');
    $('contentTitle').textContent = '绔犺妭鍐呭';
    $('qualityPanel').style.display = 'none';
    $('thinkingContainer').innerHTML = '';
    $('nextBatchBtn').style.display = 'none';
    qualityReport = null;
    $('qualityPanel').style.display = 'none';
    $('generateBtn').classList.add('running');
    $('generateBtn').disabled = true;
    $('generateBtn').innerHTML = '<span>鈴?/span> 鐢熸垚涓?..';
    $('qualityCheckBtn').disabled = true;

    // 鍒涘缓鏍囩椤?    for (let i = startChapter; i <= currentBatchEnd; i++) {
        chapters[i] = { title: `绗?{i}绔燻, content: '', status: 'pending' };
        createChapterTab(i);
    }
    // 娓叉煋绗竴椤垫爣绛?    renderTabPage();
    updateStatus();
    updateProgress();
    
    // 鐢熸垚寮€濮嬫椂锛岄粯璁ゆ樉绀虹涓€涓珷鑺傦紙杩涘叆鐩存挱妯″紡锛?    showChapter(startChapter);

    // 鍚姩 SSE
    try {
        const payload = {
            project_id: projectId,
            volume_number: volumeNumber,
            start_chapter: startChapter,
            batch_size: batchSize,
            model: model,
            messages: sessionMessages
        };

        const resp = await fetch('/api/conversation/generate-batch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        let currentThinking = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split('\n');

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const dataStr = line.slice(6).trim();
                if (!dataStr) continue;
                if (dataStr === '[DONE]') {
                    finalizeGeneration();
                    continue;
                }

                try {
                    const data = JSON.parse(dataStr);
                    if (data.error) {
                        showToast('鐢熸垚閿欒: ' + data.error, 'error');
                        isGenerating = false;
                        resetGenerateBtn();
                        return;
                    }
                    if (data.session_messages) {
                        // 绮剧畝瀵硅瘽鍘嗗彶锛氬彧淇濈暀鍒濆璁惧畾 prompt + 鏈€鏂?AI 鍥炲
                        // 鍘绘帀涓棿杩囨湡鐨?gen_prompt锛堟棫鐨勬壒娆＄粏绾插鍚庣画鎵规鏃犵敤锛?                        const msgs = data.session_messages;
                        if (msgs.length >= 2) {
                            sessionMessages = [msgs[0], msgs[msgs.length - 1]];
                        } else {
                            sessionMessages = msgs;
                        }
                    }
                    if (data.reasoning) {
                        currentThinking += data.reasoning;
                        updateThinkingDisplay(currentThinking);
                    }
                    if (data.content) {
                        fullText += data.content;
                        parseChaptersFromStream(fullText);
                    }
                } catch (e) {
                    // 蹇界暐瑙ｆ瀽澶辫触鐨勮
                }
            }
        }

        if (isGenerating) finalizeGeneration();

    } catch (e) {
        showToast('璇锋眰澶辫触: ' + e.message, 'error');
        isGenerating = false;
        resetGenerateBtn();
    }
}

// 涓枃鏁板瓧杞樋鎷変集鏁板瓧
function cnToInt(cn) {
    const map = {'涓€':1,'浜?:2,'涓?:3,'鍥?:4,'浜?:5,'鍏?:6,'涓?:7,'鍏?:8,'涔?:9,'鍗?:10,'鐧?:100,'鍗?:1000,'涓?:10000,'浜?:100000000};
    if (/^\d+$/.test(cn)) return parseInt(cn);
    let total = 0, temp = 0;
    for (const c of cn) {
        if (map[c] === undefined) continue;
        const n = map[c];
        if (n >= 10) {
            if (temp === 0) temp = 1;
            total += temp * n;
            temp = 0;
        } else {
            temp = temp ? temp * 10 + n : n;
        }
    }
    return total + temp;
}

// ===== 浠庢祦鏂囨湰涓В鏋愮珷鑺?=====
let _lastLiveUpdate = 0;
function parseChaptersFromStream(text) {
    // 鏀寔闃挎媺浼暟瀛楀拰涓枃鏁板瓧
    const headingRegex = /### 绗?[涓€浜屼笁鍥涗簲鍏竷鍏節鍗佺櫨鍗冧竾浜縗d]+)绔燶s*(.*?)\n/g;
    const headings = [];
    let m;
    while ((m = headingRegex.exec(text)) !== null) {
        headings.push({
            num: cnToInt(m[1]),
            title: m[2].trim(),
            index: m.index,
            end: m.index + m[0].length
        });
    }

    let latestChNum = null;
    // 鎻愬彇姣忎釜绔犺妭鐨勫唴瀹?    for (let i = 0; i < headings.length; i++) {
        const h = headings[i];
        const chNum = h.num;
        const startIdx = h.end;
        const endIdx = (i + 1 < headings.length) ? headings[i + 1].index : text.length;
        const content = text.substring(startIdx, endIdx).trim();

        if (chapters[chNum]) {
            const isNewChapter = !chapters[chNum].content;
            chapters[chNum].title = h.title || `绗?{chNum}绔燻;
            chapters[chNum].content = content;
            chapters[chNum].status = 'generating';
            updateChapterTab(chNum);
            latestChNum = chNum;
            
            // 鏂扮珷鑺傚嚭鐜版椂锛岃嚜鍔ㄥ垏鎹㈠埌璇ョ珷鑺傦紙鐩存挱璺熼殢锛?            if (isNewChapter && isGenerating) {
                showChapter(chNum);
            }
        }
    }
    
    // 鑺傛祦鏇存柊锛氬綋鍓嶆樉绀虹珷鑺傜殑瀹炴椂鍐呭锛堟瘡200ms鏈€澶氭洿鏂颁竴娆★紝閬垮厤棰戠箒閲嶆覆鏌擄級
    if (latestChNum && isGenerating && activeChapter === latestChNum) {
        const now = Date.now();
        if (now - _lastLiveUpdate > 200) {
            _lastLiveUpdate = now;
            const ch = chapters[latestChNum];
            $('contentTitle').textContent = ch.title;
            // 鐢熸垚涓蛋鍚屾牱鐨勬钀芥覆鏌擄紙涓嶇敤璐ㄦ楂樹寒锛?            $('contentBody').innerHTML = '<div class="content-body-inner">' + _paragraphsToHtml(ch.content.split('\n\n').filter(p => p.trim())) + '</div>';
            $('contentBody').scrollTop = $('contentBody').scrollHeight;
        }
    }
    
    updateStatus();
    updateProgress();
}

function createChapterTab(chNum, container) {
    const tab = document.createElement('button');
    tab.className = 'chapter-tab';

    const title = chapters[chNum].title || `绗?{chNum}绔燻;

    if (container) container.appendChild(tab);

}

function updateChapterTab(chNum) {
    const tab = document.querySelector(`.chapter-tab[data-ch="${chNum}"]`);
    if (!tab) return;
    const ch = chapters[chNum];
    tab.innerHTML = `<span class="dot ${ch.status}"></span><span class="ch-title">${escapeHtml(ch.title)}</span>`;
}

function renderTabPage() {
    const container = $('tabTabContainer');
    if (!container) return;
    container.innerHTML = '';
    const allChapters = Object.keys(chapters).map(Number).sort((a, b) => a - b);
    if (allChapters.length === 0) {
        updateTabPageControls(0, 0);
        return;
    }
    const totalPages = Math.ceil(allChapters.length / TAB_PAGE_SIZE);
    if (tabCurrentPage >= totalPages) tabCurrentPage = totalPages - 1;
    if (tabCurrentPage < 0) tabCurrentPage = 0;
    const start = tabCurrentPage * TAB_PAGE_SIZE;
    const end = Math.min(start + TAB_PAGE_SIZE, allChapters.length);
    for (let i = start; i < end; i++) {
        createChapterTab(allChapters[i], container);
    }
    if (activeChapter) {
        const tab = document.querySelector(`.chapter-tab[data-ch="${activeChapter}"]`);
        if (tab) tab.classList.add('active');
    }
    updateTabPageControls(tabCurrentPage + 1, totalPages);
}

function updateTabPageControls(current, total) {
    $('tabPrevBtn').disabled = current <= 1;
    $('tabNextBtn').disabled = current >= total || total <= 1;
    $('tabPageInfo').textContent = total > 0 ? current + '/' + total : '';
}

function prevTabPage() {
    if (tabCurrentPage > 0) {
        tabCurrentPage--;
        renderTabPage();
    }
}

function nextTabPage() {
    const allChapters = Object.keys(chapters).map(Number).sort((a, b) => a - b);
    const totalPages = Math.ceil(allChapters.length / TAB_PAGE_SIZE);
    if (tabCurrentPage < totalPages - 1) {
        tabCurrentPage++;
        renderTabPage();
    }
}

function ensureTabPageForCh(chNum) {
    const allChapters = Object.keys(chapters).map(Number).sort((a, b) => a - b);
    const idx = allChapters.indexOf(chNum);
    if (idx === -1) return;
    const targetPage = Math.floor(idx / TAB_PAGE_SIZE);
    if (targetPage !== tabCurrentPage) {
        tabCurrentPage = targetPage;
        renderTabPage();
    }
}

function showChapter(chNum) {
    showingRef = false;

    isEditMode = false;

// 甯歌寮曞彿 Unicode
const DIALOGUE_RE = /^[\u201C\u201D\u0022\u300C\u300E]/;

function _paragraphsToHtml(paragraphs) {
    return paragraphs.map(p => {
        const isDialogue = DIALOGUE_RE.test(p);
        const isShort = p.length <= 15;
        let cls = '';
        if (isDialogue) cls = 'dialogue';
        else if (isShort) cls = 'short';
        return `<p class="${cls}">${escapeHtml(p)}</p>`;
    }).join('\n');
}

// ===== 娓叉煋绔犺妭鍐呭锛岄珮浜川妫€闂 =====
function renderChapterWithHighlights(content, chNum) {
    // 缃戞枃娈佃惤涓嶅仛鍚堝苟锛屼繚鎸丄I鍘熸牱锛堢煭娈佃惤鏄暘鑼勯鏍硷級
    const paragraphs = content.split('\n\n').filter(p => p.trim());
    let html = _paragraphsToHtml(paragraphs);

    // 濡傛灉鏈夎川妫€鎶ュ憡锛岄珮浜綋鍓嶇珷鑺傜殑闂鏂囧瓧
    if (qualityReport && qualityReport.issues) {
        const chapterIssues = qualityReport.issues.filter(i => (i.chapter || '').toString() === chNum.toString());
        for (const issue of chapterIssues) {
            const highlights = issue.highlights || [];
            for (const hl of highlights) {
                if (!hl.trim()) continue;
                const safeHl = escapeHtml(hl);
                const color = issue.severity === 'critical' ? '#ef4444' : (issue.severity === 'warning' ? '#f59e0b' : '#3b82f6');
                const bg = issue.severity === 'critical' ? 'rgba(239,68,68,0.15)' : (issue.severity === 'warning' ? 'rgba(245,158,11,0.12)' : 'rgba(59,130,246,0.1)');
                // 鐢?mark 鏍囩楂樹寒锛屽苟娣诲姞 tooltip
                const markHtml = `<mark style="background:${bg};color:${color};border-radius:3px;padding:1px 3px;cursor:pointer;" title="${escapeHtml(issue.category || '')}: ${escapeHtml(issue.description || '')}" onclick="showIssueTip(this)">${safeHl}</mark>`;
                html = html.replaceAll(safeHl, markHtml);
            }
        }
    }
    return html;
}

function showIssueTip(el) {
    showToast(el.getAttribute('title'), 'info');
}

    $('qualityCheckBtn').disabled = true;
    $('qualityCheckBtn').innerHTML = '<span>鈴?/span> 璐ㄦ涓?..';

                project_id: currentProject,

function renderQualityReport(report) {

async function confirmRewrite() {
    const chNum = activeChapter;
    const instruction = $('rewriteInstruction').value.trim();
    if (!chNum) return;

    closeRewriteModal();
    showToast(`馃攧 寮€濮嬮噸鍐欑${chNum}绔?..`, 'info');

    chapters[chNum].status = 'generating';
    chapters[chNum].content = '';
    updateChapterTab(chNum);
    showChapter(chNum);

    try {
        const payload = {
            project_id: currentProject,
            volume_number: currentVolume,
            start_chapter: chNum,
            batch_size: 1,
            model: $('modelSelect').value,
            messages: [
                ...sessionMessages,
                { role: 'user', content: `璇烽噸鍐欑${chNum}绔犮€備慨鏀硅姹傦細${instruction || '璇蜂紭鍖栨湰绔犺川閲忥紝澧炲己鐖界偣锛屼慨姝ｉ棶棰樸€?}` }
            ]
        };

        const resp = await fetch('/api/conversation/generate-batch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        let _rewriteLastUpdate = 0;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split('\n');
            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const dataStr = line.slice(6).trim();
                if (!dataStr || dataStr === '[DONE]') continue;
                try {
                    const data = JSON.parse(dataStr);
                    if (data.content) {
                        fullText += data.content;
                        // 瀹炴椂瑙ｆ瀽骞舵樉绀猴紙鑺傛祦 200ms锛?                        const now = Date.now();
                        if (now - _rewriteLastUpdate > 200) {
                            _rewriteLastUpdate = now;
                            const regex = /### 绗?[涓€浜屼笁鍥涗簲鍏竷鍏節鍗佺櫨鍗冧竾浜縗d]+)绔燶s*(.*?)\n/;
                            const match = regex.exec(fullText);
                            if (match) {
                                chapters[chNum].title = match[2].trim() || `绗?{chNum}绔燻;
                                chapters[chNum].content = fullText.substring(match.index + match[0].length).trim();
                                if (activeChapter === chNum) {
                                    $('contentTitle').textContent = chapters[chNum].title;
                                    $('contentBody').innerHTML = '<div class="content-body-inner">' + _paragraphsToHtml(chapters[chNum].content.split('\n\n').filter(p => p.trim())) + '</div>';
                                    $('contentBody').scrollTop = $('contentBody').scrollHeight;
                                }
                            }
                        }
                    }
                } catch (e) {}
            }
        }

        // 鏈€缁堣В鏋愰噸鍐欑粨鏋滐紙鏀寔涓枃鏁板瓧锛?        const regex = /### 绗?[涓€浜屼笁鍥涗簲鍏竷鍏節鍗佺櫨鍗冧竾浜縗d]+)绔燶s*(.*?)\n/;
        const match = regex.exec(fullText);
        if (match) {
            const title = match[2].trim();
            const content = fullText.substring(match.index + match[0].length).trim();
            chapters[chNum].title = title || `绗?{chNum}绔燻;
            chapters[chNum].content = content;
        } else {
            chapters[chNum].content = fullText;
        }
        chapters[chNum].status = 'generated';
        updateChapterTab(chNum);
        showChapter(chNum);
        showToast('鉁?閲嶅啓瀹屾垚', 'success');
    } catch (e) {
        chapters[chNum].status = 'failed';
        updateChapterTab(chNum);
        showToast('閲嶅啓澶辫触: ' + e.message, 'error');
    }
}

function updateOutlinePanel(chNum) {
    const panelBody = document.getElementById('outlinePanelBody');

    const section = extractOutlineSection(chNum);
    if (!section) {

function extractOutlineSection(chNum) {
    if (!projectFiles || !projectFiles.detailed_outline) return null;
    const md = projectFiles.detailed_outline;
    const regex = new RegExp('^#{1,3}\\s*绗琝\s*' + chNum + '\\s*绔?*$', 'm');
    const startMatch = md.match(regex);
    if (!startMatch) return null;
    const start = startMatch.index;
    const nextRegex = new RegExp('^#{1,3}\\s*绗琝\s*' + (chNum + 1) + '\\s*绔?*$', 'm');
    const endMatch = md.match(nextRegex);
    const end = endMatch ? endMatch.index : md.length;
    return md.substring(start, end).trim();
}

function enterOutlineEdit(chNum) {
    editingOutlineChNum = chNum;
    const panelBody = document.getElementById('outlinePanelBody');

function parseStoryline(markdown) {
    if (!markdown) return [];
    const chapters = [];
    // 鏀寔1-3绾arkdown鏍囬锛屽吋瀹瑰悇绉嶆牸寮?    const chapterRegex = /^#{1,3}\s*绗琝s*(\d+)\s*绔??:[\s:锛歖+(.+?))?$/gm;
    let match;
    const positions = [];
    while ((match = chapterRegex.exec(markdown)) !== null) {
        positions.push({ index: match.index, num: parseInt(match[1]), title: match[2].trim() });
    }
    for (let i = 0; i < positions.length; i++) {
        const start = positions[i].index;
        const end = positions[i + 1] ? positions[i + 1].index : markdown.length;
        const block = markdown.slice(start, end);
        const ch = { num: positions[i].num, title: positions[i].title };
        const extract = (label) => {
            const r = new RegExp('\\*\\*' + label + '\\*\\*[锛?]\\s*(.+?)(?=\\n\\*\\*|\\n#{1,3}|\\s*$)', 's');
            const m = block.match(r);
            return m ? m[1].trim() : '';
        };
        ch.scene = extract('鍦烘櫙璁惧畾');
        const charsRaw = extract('娑夊強瑙掕壊');
        ch.characters = charsRaw ? charsRaw.split(/[,锛屻€?]/).map(s => s.trim()).filter(Boolean) : [];
        ch.hook = extract('鏍稿績鐖界偣/鐚庡鐐?) || extract('鏍稿績鐖界偣');
        ch.steps = [];
        const stepsMatch = block.match(/\*\*鎯呰妭姝ラ\*\*[锛?]?\s*([\s\S]*?)(?=\n\*\*|\n#{1,3}|\s*$)/);
        if (stepsMatch) {
            const stepLines = stepsMatch[1].split('\n');
            for (const line of stepLines) {
                const m = line.match(/^\s*\d+[.锛嶿\s*(.+)$/);
                if (m) ch.steps.push(m[1].trim());
            }
        }
        ch.dialogues = [];
        const dlgMatch = block.match(/\*\*鍏抽敭瀵硅瘽\*\*[锛?]?\s*([\s\S]*?)(?=\n\*\*|\n#{1,3}|\s*$)/);
        if (dlgMatch) {
            const dlgLines = dlgMatch[1].split('\n');
            for (const line of dlgLines) {
                const m = line.match(/^\s*[-鈥\s*["\'](.+)["\']$/);
                if (m) ch.dialogues.push(m[1].trim());
            }
        }
        ch.climaxDesign = extract('鐖界偣璁捐璇存槑') || extract('鐖界偣璁捐');
        ch.endingHook = extract('绔犺妭缁撳熬閽╁瓙') || extract('缁撳熬閽╁瓙');
        ch.emotion = extract('鎯呯华鏇茬嚎') || extract('鎯呯华璧板悜');
        ch.wordCount = extract('棰勮瀛楁暟') || extract('棰勪及瀛楁暟');
        chapters.push(ch);
    }
    return chapters;
}

function highlightHook(hookText, chapterNum) {

        const body = document.getElementById('contentBody');

        const keywords = hookText.split(/[锛?銆乗s]+/).filter(w => w.length >= 2).slice(0, 4);
        if (keywords.length === 0) return;
        let html = body.innerHTML;
        for (const kw of keywords) {
            const regex = new RegExp(escapeRegExp(kw), 'g');
            html = html.replace(regex, '<mark style="background:rgba(245,158,11,0.3);color:#fbbf24;padding:1px 3px;border-radius:3px;">' + kw + '</mark>');
        }
        body.innerHTML = html;
        showToast('馃挜 宸查珮浜' + chapterNum + '绔犵埥鐐瑰叧閿瘝', 'success');
    }, 300);
}

function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// 澶嶅埗褰撳墠绔犺妭姝ｆ枃
function copyChapterContent() {
    if (!activeChapter || !chapters[activeChapter] || !chapters[activeChapter].content) {
        showToast('娌℃湁鍙鍒剁殑鍐呭', 'error');
        return;
    }
    const text = chapters[activeChapter].content;
    navigator.clipboard.writeText(text).then(() => {
        showToast('鉁?宸插鍒跺埌鍓创鏉?, 'success');
    }).catch(() => {
        // 闄嶇骇鏂规
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showToast('鉁?宸插鍒跺埌鍓创鏉?, 'success');
        } catch {
            showToast('鉂?澶嶅埗澶辫触锛岃鎵嬪姩澶嶅埗', 'error');
        }
        document.body.removeChild(textarea);
    });
}

// ===== 鏁呬簨绾垮墽鐓у姛鑳?=====
let storylineStills = []; // 宸插姞杞界殑鍓х収缂撳瓨 { image_id, chapter_num, image_type, image_url, character_name }
let stillModalState = { chNum: null, type: null, name: null };

// 浠庨」鐩瀹氫腑鎻愬彇瑙掕壊澶栬矊鎻忚堪
function extractCharacterAppearance(characterName) {
    if (!projectFiles || !projectFiles.settings || !characterName) return '';
    const settings = projectFiles.settings;

    // 绛栫暐1: 鎼滅储瑙掕壊鍚嶉檮杩戠殑"澶栬矊"銆?闀跨浉"銆?褰㈣薄"鍏抽敭璇?    const nameIdx = settings.indexOf(characterName);
    if (nameIdx === -1) return '';

    // 鍚戝墠鍚戝悗鍚勫彇500瀛楃
    const start = Math.max(0, nameIdx - 300);
    const end = Math.min(settings.length, nameIdx + 500);
    const context = settings.slice(start, end);

    // 灏濊瘯鍖归厤甯歌鏍煎紡
    const patterns = [
        new RegExp(characterName + '[锛?锛歖\\s*([^\\n]{10,200})', 'i'),
        /澶栬矊[锛?锛歖\s*([^\n]{10,200})/i,
        /闀跨浉[锛?锛歖\s*([^\n]{10,200})/i,
        /褰㈣薄[锛?锛歖\s*([^\n]{10,200})/i,
        /闈㈠[锛?锛歖\s*([^\n]{10,200})/i,
        /澶栬[锛?锛歖\s*([^\n]{10,200})/i,
    ];
    for (const p of patterns) {
        const m = context.match(p);
        if (m) return m[1].trim();
    }
    return '';
}

// 娓呮礂瑙掕壊鍚嶏紝鍘绘帀鎷彿鏍囨敞濡?锛堥娆″嚭鍦猴級"
function cleanCharacterName(name) {
    if (!name) return '';
    return name.replace(/[锛?].*?[锛?]/g, '').trim();
}

// 浠庨」鐩瀹氫腑妫€娴嬪皬璇寸被鍨嬶紝杩斿洖 prompt 鍓嶇紑鍜岀害鏉?function detectNovelStyle() {

        styleHint: '鐪熷疄鐓х墖璐ㄦ劅锛岃嚜鐒跺厜褰憋紝鍐欏疄椋庢牸',
        negHint: '涓嶇骞讳笉鍙よ涓嶄粰渚犱笉鍔ㄦ极',
        defaultDesc: '鐜颁唬鏃ュ父绌挎惌锛岄兘甯傛皵璐紝鐪熷疄浜哄儚'
    };

    const genres = [

            genre: 'xianxia',
            scenePrefix: '鍙ら浠欎緺灏忚鍦烘櫙',
            charPrefix: '鍙ら浠欎緺灏忚瑙掕壊',
            styleHint: '鍥芥极椋庢牸锛屽敮缇庣粏鑵?,
            negHint: '涓嶇幇浠ｄ笉绉戝够',
            defaultDesc: '鍙ら鏈嶉グ锛岄閫搁暱鍙戯紝浠欐皵椋橀'
        },
        {
            keys: ['绉戝够', '鏄熼檯', '鏈虹敳', '鏈潵', '璧涘崥', '鏈笘', '鍩哄洜', '閲忓瓙', '椋炶埞'],
            genre: 'scifi',
            scenePrefix: '绉戝够灏忚鍦烘櫙',
            charPrefix: '绉戝够灏忚瑙掕壊',
            styleHint: '鏈潵鎰燂紝鐢靛奖鎴浘',
            negHint: '涓嶅彜椋庝笉鐜颁唬鏃ュ父',
            defaultDesc: '鏈潵鎰熸湇瑁咃紝绉戞妧鍏冪礌锛屽喎宄绘皵璐?
        },
        {
            keys: ['鎮枒', '鎺ㄧ悊', '鍒戜睛', '鎺㈡', '鐘姜', '鎯婃倸', '娉曞尰', '璋嶆垬'],
            genre: 'suspense',
            scenePrefix: '鎮枒灏忚鍦烘櫙',
            charPrefix: '鎮枒灏忚瑙掕壊',
            styleHint: '鍐欏疄鏆楄皟锛岀數褰辨劅',
            negHint: '涓嶇骞讳笉鍙よ涓嶅敮缇?,
            defaultDesc: '鍐欏疄椋庢牸锛岀溂绁炴湁鎴忥紝姘旇川娌夌ǔ'
        },
        {
            keys: ['瑷€鎯?, '鐢滃疇', '铏愭亱', '闇告€?, '鍗冮噾', '濠氭亱', '绔归┈'],
            genre: 'romance',
            scenePrefix: '娴极瑷€鎯呭皬璇村満鏅?,
            charPrefix: '娴极瑷€鎯呭皬璇磋鑹?,
            styleHint: '鍞編鏌斿拰锛岄煩鍓ч鏍?,
            negHint: '涓嶇骞讳笉鍙よ涓嶆殫璋?,
            defaultDesc: '鏃跺皻绮捐嚧锛屾皵璐ㄤ紭闆咃紝鏌斿拰鍏夊奖'
        },
        {
            keys: ['鍘嗗彶', '鏋剁┖', '鐜嬫湞', '鐨囧笣', '瀹枟', '鏉冭皨', '璇镐警'],
            genre: 'history',
            scenePrefix: '鍘嗗彶鏋剁┖灏忚鍦烘櫙',
            charPrefix: '鍘嗗彶鏋剁┖灏忚瑙掕壊',
            styleHint: '鍙ら鍐欏疄锛屽巻鍙茶川鎰?,
            negHint: '涓嶇幇浠ｄ笉绉戝够',
            defaultDesc: '鍙や唬鏈嶉グ锛屼华鎬佺搴勶紝鍘嗗彶璐ㄦ劅'
        },
    ];

    for (const g of genres) {
        if (g.keys.some(k => text.includes(k) || low.includes(k))) return g;
    }
    // 榛樿鐜颁唬閮藉競
    return {
        genre: 'modern',
        scenePrefix: '鐜颁唬閮藉競灏忚鍦烘櫙',
        charPrefix: '鐜颁唬閮藉競灏忚瑙掕壊',
        styleHint: '鐪熷疄鐓х墖璐ㄦ劅锛岃嚜鐒跺厜褰憋紝鍐欏疄椋庢牸',
        negHint: '涓嶇骞讳笉鍙よ涓嶄粰渚犱笉鍔ㄦ极',
        defaultDesc: '鐜颁唬鏃ュ父绌挎惌锛岄兘甯傛皵璐紝鐪熷疄浜哄儚'
    };
}

// 鏋勯€犲満鏅浘prompt
function buildScenePrompt(sceneText) {
    if (!sceneText) return '';
    const g = detectNovelStyle();
    return `${g.scenePrefix}锛?{sceneText}锛?{g.styleHint}锛?{g.negHint}`;
}

// 鏋勯€犺鑹插浘prompt
function buildCharacterPrompt(characterName) {
    const cleanName = cleanCharacterName(characterName);
    if (!cleanName) return '';
    const appearance = extractCharacterAppearance(cleanName);
    const g = detectNovelStyle();
    const desc = appearance || g.defaultDesc;
    return `${g.charPrefix}銆?{cleanName}銆嶏細${desc}锛?{g.styleHint}锛?{g.negHint}`;
}

// 鏄剧ず鍓х収鐢熸垚妯℃€佹
function showStillModal(chNum, type, name) {
    stillModalState = { chNum, type, name };
    const titleEl = document.getElementById('stillModalTitle');
    const promptEl = document.getElementById('stillPrompt');
    const ch = storylineData.find(c => c.num === chNum);

    if (type === 'scene') {
        titleEl.textContent = `馃幀 鐢熸垚绗?{chNum}绔犲満鏅浘`;
        promptEl.value = buildScenePrompt(ch ? ch.scene : '');
    } else {
        const cleanName = cleanCharacterName(name);
        titleEl.textContent = `馃懁 鐢熸垚銆?{cleanName}銆嶈鑹插浘`;
        promptEl.value = buildCharacterPrompt(name);
    }

    document.getElementById('stillGenerateBtn').disabled = false;
    document.getElementById('stillGenerateBtn').textContent = '鐢熸垚';
    document.getElementById('stillModal').classList.add('show');
}

function closeStillModal() {
    document.getElementById('stillModal').classList.remove('show');
    stillModalState = { chNum: null, type: null, name: null };
}

// 纭鐢熸垚鍓х収
async function confirmGenerateStill() {
    const { chNum, type, name } = stillModalState;
    if (!chNum || !type) return;

    const prompt = document.getElementById('stillPrompt').value.trim();
    if (!prompt) { showToast('璇疯緭鍏ユ彁绀鸿瘝', 'error'); return; }

    const btn = document.getElementById('stillGenerateBtn');
    btn.disabled = true;
    btn.textContent = '鈴?鐢熸垚涓?..';

    try {
        const response = await fetch('/api/storyline/generate-still', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                project_id: currentProject || document.getElementById('projectSelect').value,
                chapter_num: chNum,
                image_type: type,
                prompt: prompt,
                character_name: type === 'character' ? name : null,
                aspect_ratio: type === 'scene' ? '16:9' : '9:16',
                novel_title: currentProject
            })
        });

        const data = await response.json();
        if (data.success) {
            storylineStills.push(data.data);
            renderStillsInStoryline();
            showToast('鉁?鍓х収鐢熸垚鎴愬姛', 'success');
            closeStillModal();
        } else {
            showToast('鐢熸垚澶辫触: ' + (data.error || '鏈煡閿欒'), 'error');
            btn.disabled = false;
            btn.textContent = '鐢熸垚';
        }
    } catch (e) {
        showToast('璇锋眰澶辫触: ' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = '鐢熸垚';
    }
}

// 鍔犺浇鏌愰」鐩殑鎵€鏈夋晠浜嬬嚎鍓х収
async function loadStorylineStills(projectId) {
    if (!projectId) return;
    try {
        const resp = await fetch(`/api/storyline/stills?project_id=${encodeURIComponent(projectId)}&limit=200`);
        const data = await resp.json();
        if (data.success) {
            storylineStills = data.data;
            renderStillsInStoryline();
        }
    } catch (e) {
        console.error('鍔犺浇鍓х収澶辫触:', e);
    }
}

// 鍦ㄦ晠浜嬬嚎涓覆鏌撳凡鍔犺浇鐨勫墽鐓?function renderStillsInStoryline() {
    if (!showingStoryline) return;

    for (const still of storylineStills) {
        const meta = still.metadata || {};
        const chNum = meta.chapter_num;
        const type = still.image_type;
        if (!chNum || !type) continue;

        let containerId;
        if (type === 'scene') {
            containerId = 'still-scene-ch' + chNum;
        } else if (type === 'character') {
            containerId = 'still-char-ch' + chNum;
        } else {
            continue;
        }

        const container = document.getElementById(containerId);
        if (!container) continue;

        // 妫€鏌ユ槸鍚﹀凡娓叉煋锛堥伩鍏嶉噸澶嶏級
        if (container.querySelector(`[data-image-id="${still.image_id}"]`)) continue;

        const img = document.createElement('img');
        img.src = still.image_url;
        img.className = 'still-image-thumb';
        img.title = still.prompt;
        img.dataset.imageId = still.image_id;
        img.onclick = () => window.open(still.image_url, '_blank');
        container.appendChild(img);
    }
}
