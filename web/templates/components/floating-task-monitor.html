{# 全局任务监控浮窗 - 支持多任务后台运行 #}
<div id="globalTaskFloat" class="global-task-float" style="display: none;">
    <!-- 迷你模式 (默认) -->
    <div class="gtf-mini" id="gtf-mini" onclick="expandTaskFloat()">
        <div class="gtf-mini-pulse"></div>
        <div class="gtf-mini-icon">📝</div>
        <div class="gtf-mini-count" id="gtf-task-count" style="display: none;">1</div>
        <svg class="gtf-mini-ring" viewBox="0 0 36 36">
            <path class="gtf-ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path id="gtf-mini-progress" class="gtf-ring-progress" stroke-dasharray="0, 100" 
                  d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        </svg>
    </div>
    
    <!-- 展开模式 (任务列表) -->
    <div class="gtf-panel" id="gtf-panel" style="display: none;">
        <div class="gtf-header">
            <div class="gtf-header-title">
                <span id="gtf-panel-title">正在运行 0 个任务</span>
                <span class="gtf-pulse-dot"></span>
            </div>
            <button class="gtf-btn-icon" onclick="collapseTaskFloat(); event.stopPropagation();" title="收起">
                <span class="material-icons">expand_more</span>
            </button>
        </div>
        
        <!-- 任务列表 -->
        <div class="gtf-task-list" id="gtf-task-list">
            <!-- 动态生成任务项 -->
        </div>
        
        <!-- 底部统计 -->
        <div class="gtf-footer" id="gtf-footer" style="display: none;">
            <span id="gtf-total-progress">总进度: 0%</span>
            <span id="gtf-total-points">消耗: 0点</span>
        </div>
    </div>
</div>

<style>
/* ==================== 全局任务浮窗样式 ==================== */
.global-task-float {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* 迷你模式 */
.gtf-mini {
    position: relative;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 
                0 0 0 1px rgba(99, 102, 241, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
}

.gtf-mini:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 30px rgba(99, 102, 241, 0.4), 
                0 0 0 2px rgba(99, 102, 241, 0.5);
}

.gtf-mini-pulse {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(99, 102, 241, 0.3);
    animation: gtf-pulse 2s infinite;
}

@keyframes gtf-pulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
}

.gtf-mini-icon {
    font-size: 24px;
    z-index: 1;
}

.gtf-mini-count {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 20px;
    height: 20px;
    background: #ef4444;
    color: white;
    font-size: 11px;
    font-weight: bold;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #0f172a;
    z-index: 2;
}

.gtf-mini-ring {
    position: absolute;
    width: 54px;
    height: 54px;
    transform: rotate(-90deg);
}

.gtf-ring-bg {
    fill: none;
    stroke: rgba(255, 255, 255, 0.1);
    stroke-width: 2;
}

.gtf-ring-progress {
    fill: none;
    stroke: url(#gtf-gradient);
    stroke-width: 2;
    stroke-linecap: round;
    transition: stroke-dasharray 0.5s ease;
}

/* 展开面板 */
.gtf-panel {
    position: absolute;
    right: 0;
    bottom: 70px;
    width: 360px;
    max-height: 500px;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 
                0 0 0 1px rgba(99, 102, 241, 0.2);
    overflow: hidden;
    animation: gtf-slide-in 0.3s ease;
}

@keyframes gtf-slide-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.gtf-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.gtf-header-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
}

.gtf-pulse-dot {
    width: 8px;
    height: 8px;
    background: #10b981;
    border-radius: 50%;
    animation: gtf-dot-pulse 1.5s infinite;
}

@keyframes gtf-dot-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.gtf-btn-icon {
    background: rgba(255, 255, 255, 0.1);
    border: none;
    color: #94a3b8;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.gtf-btn-icon:hover {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
}

.gtf-btn-icon .material-icons {
    font-size: 18px;
}

/* 任务列表 */
.gtf-task-list {
    max-height: 350px;
    overflow-y: auto;
    padding: 12px;
}

.gtf-task-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    transition: all 0.2s;
}

.gtf-task-item:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(99, 102, 241, 0.3);
}

.gtf-task-item:last-child {
    margin-bottom: 0;
}

.gtf-task-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.gtf-task-title {
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
}

.gtf-task-type {
    font-size: 11px;
    color: #94a3b8;
    background: rgba(255, 255, 255, 0.05);
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
}

.gtf-task-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
}

.gtf-progress-bar {
    flex: 1;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    overflow: hidden;
}

.gtf-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 100%);
    border-radius: 3px;
    transition: width 0.5s ease;
}

.gtf-progress-text {
    font-size: 12px;
    font-weight: 600;
    color: #6366f1;
    min-width: 35px;
    text-align: right;
}

.gtf-task-stage {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 10px;
}

.gtf-task-actions {
    display: flex;
    gap: 8px;
}

.gtf-btn {
    flex: 1;
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
}

.gtf-btn-primary {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: #fff;
}

.gtf-btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
}

.gtf-btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: #e2e8f0;
}

.gtf-btn-secondary:hover {
    background: rgba(255, 255, 255, 0.15);
}

.gtf-btn-danger {
    background: rgba(239, 68, 68, 0.2);
    color: #f87171;
}

.gtf-btn-danger:hover {
    background: rgba(239, 68, 68, 0.3);
}

/* 底部统计 */
.gtf-footer {
    display: flex;
    justify-content: space-between;
    padding: 12px 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 12px;
    color: #94a3b8;
}

/* 空状态 */
.gtf-empty {
    padding: 40px 20px;
    text-align: center;
    color: #64748b;
}

.gtf-empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
}

/* 响应式 */
@media (max-width: 640px) {
    .gtf-panel {
        width: calc(100vw - 40px);
        max-width: 360px;
    }
}

/* SVG渐变定义 */
.gtf-defs {
    position: absolute;
    width: 0;
    height: 0;
}
</style>

<!-- SVG渐变定义 -->
<svg class="gtf-defs">
    <defs>
        <linearGradient id="gtf-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
        </linearGradient>
    </defs>
</svg>

<script>
(function() {
    'use strict';
    
    // ==================== 配置 ====================
    const CONFIG = {
        STORAGE_KEY: 'market_driven_background_tasks',
        CHECK_INTERVAL: 30000, // 30秒检查一次
    };
    
    // ==================== 状态管理 ====================
    const TaskManager = {
        tasks: [],
        pollInterval: null,
        isExpanded: false,
        
        // 获取所有任务
        getTasks() {
            try {
                const data = localStorage.getItem(CONFIG.STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                console.error('[TaskManager] 读取任务失败:', e);
                return [];
            }
        },
        
        // 保存任务
        saveTasks(tasks) {
            try {
                localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(tasks));
                this.tasks = tasks;
                return true;
            } catch (e) {
                console.error('[TaskManager] 保存任务失败:', e);
                return false;
            }
        },
        
        // 添加任务
        addTask(task) {
            const tasks = this.getTasks();
            // 检查是否已存在相同task_id
            const existingIndex = tasks.findIndex(t => t.task_id === task.task_id);
            if (existingIndex >= 0) {
                tasks[existingIndex] = { ...tasks[existingIndex], ...task };
            } else {
                tasks.push(task);
            }
            this.saveTasks(tasks);
            UI.update();
        },
        
        // 更新任务
        updateTask(taskId, updates) {
            const tasks = this.getTasks();
            const index = tasks.findIndex(t => t.task_id === taskId);
            if (index >= 0) {
                tasks[index] = { ...tasks[index], ...updates };
                this.saveTasks(tasks);
                UI.update();
                return true;
            }
            return false;
        },
        
        // 移除任务
        removeTask(taskId) {
            const tasks = this.getTasks().filter(t => t.task_id !== taskId);
            this.saveTasks(tasks);
            UI.update();
        },
        
        // 获取运行中任务
        getRunningTasks() {
            const activeStatuses = ['pending', 'running', 'in_progress', 'conversation_mode', 'generating_chapters'];
            return this.getTasks().filter(t => activeStatuses.includes(t.status));
        },
        
        // 计算总进度
        getTotalProgress() {
            const runningTasks = this.getRunningTasks();
            if (runningTasks.length === 0) return 0;
            const total = runningTasks.reduce((sum, t) => sum + (t.progress || 0), 0);
            return Math.round(total / runningTasks.length);
        }
    };
    
    // ==================== UI 组件 ====================
    const UI = {
        elements: {},
        
        // 初始化
        async init() {
            this.elements = {
                float: document.getElementById('globalTaskFloat'),
                mini: document.getElementById('gtf-mini'),
                panel: document.getElementById('gtf-panel'),
                taskCount: document.getElementById('gtf-task-count'),
                miniProgress: document.getElementById('gtf-mini-progress'),
                panelTitle: document.getElementById('gtf-panel-title'),
                taskList: document.getElementById('gtf-task-list'),
                footer: document.getElementById('gtf-footer'),
                totalProgress: document.getElementById('gtf-total-progress'),
                totalPoints: document.getElementById('gtf-total-points')
            };
            
            // 🔥 首先从服务器恢复任务（关闭浏览器后重新打开）
            await this.restoreTasksFromServer();
            
            // 初始检查
            this.checkAndShow();
        },
        
        // 🔥 从服务器恢复任务
        async restoreTasksFromServer() {
            try {
                const response = await fetch('/api/market-driven/tasks/active');
                if (!response.ok) {
                    console.log('[TaskManager] 未登录或无法获取任务');
                    return;
                }
                
                const data = await response.json();
                if (data.success && data.tasks && data.tasks.length > 0) {
                    console.log('[TaskManager] 从服务器恢复任务:', data.tasks);
                    
                    // 合并服务器任务和本地任务（以服务器为准）
                    const serverTasks = data.tasks;
                    const localTasks = TaskManager.getTasks();
                    
                    // 将服务器任务添加到本地（覆盖或新增）
                    serverTasks.forEach(serverTask => {
                        const existingIndex = localTasks.findIndex(t => t.task_id === serverTask.task_id);
                        if (existingIndex >= 0) {
                            // 更新现有任务
                            localTasks[existingIndex] = { ...localTasks[existingIndex], ...serverTask };
                        } else {
                            // 添加新任务
                            localTasks.push({
                                ...serverTask,
                                last_update: Date.now()
                            });
                        }
                    });
                    
                    TaskManager.saveTasks(localTasks);
                }
            } catch (e) {
                console.error('[TaskManager] 从服务器恢复任务失败:', e);
            }
        },
        
        // 检查并显示
        checkAndShow() {
            const runningTasks = TaskManager.getRunningTasks();
            if (runningTasks.length > 0) {
                this.elements.float.style.display = 'block';
                this.update();
            } else {
                this.elements.float.style.display = 'none';
            }
        },
        
        // 更新UI
        update() {
            const runningTasks = TaskManager.getRunningTasks();
            const allTasks = TaskManager.getTasks();
            
            // 更新迷你模式
            this.updateMiniMode(runningTasks);
            
            // 更新面板
            if (this.isExpanded) {
                this.updatePanel(allTasks);
            }
            
            // 如果没有运行中任务，隐藏浮窗
            if (runningTasks.length === 0 && allTasks.length === 0) {
                this.elements.float.style.display = 'none';
            }
        },
        
        // 更新迷你模式
        updateMiniMode(runningTasks) {
            const count = runningTasks.length;
            
            // 显示任务数量
            if (count > 1) {
                this.elements.taskCount.textContent = count;
                this.elements.taskCount.style.display = 'flex';
            } else {
                this.elements.taskCount.style.display = 'none';
            }
            
            // 更新进度圈
            const avgProgress = count > 0 
                ? Math.round(runningTasks.reduce((sum, t) => sum + (t.progress || 0), 0) / count)
                : 0;
            this.elements.miniProgress.setAttribute('stroke-dasharray', `${avgProgress}, 100`);
        },
        
        // 更新面板
        updatePanel(tasks) {
            const runningTasks = TaskManager.getRunningTasks();
            
            // 更新标题
            this.elements.panelTitle.textContent = `正在运行 ${runningTasks.length} 个任务`;
            
            // 更新任务列表
            this.elements.taskList.innerHTML = tasks.map(task => this.renderTaskItem(task)).join('');
            
            // 更新底部统计
            if (runningTasks.length > 0) {
                this.elements.footer.style.display = 'flex';
                this.elements.totalProgress.textContent = `平均进度: ${TaskManager.getTotalProgress()}%`;
                const totalPoints = runningTasks.reduce((sum, t) => sum + (t.points_consumed || 0), 0);
                this.elements.totalPoints.textContent = `已消耗: ${totalPoints.toFixed(1)}点`;
            } else {
                this.elements.footer.style.display = 'none';
            }
        },
        
        // 渲染任务项
        renderTaskItem(task) {
            const isRunning = ['pending', 'running', 'in_progress', 'conversation_mode', 'generating_chapters'].includes(task.status);
            const typeLabels = {
                'market_driven': '市场导向',
                'phase_one': '自由创意',
                'dialog': '对话打磨'
            };
            
            return `
                <div class="gtf-task-item" data-task-id="${task.task_id}">
                    <div class="gtf-task-header">
                        <span class="gtf-task-title" title="${task.title || '未命名'}">${task.title || '未命名任务'}</span>
                        <span class="gtf-task-type">${typeLabels[task.type] || '生成任务'}</span>
                    </div>
                    <div class="gtf-task-progress">
                        <div class="gtf-progress-bar">
                            <div class="gtf-progress-fill" style="width: ${task.progress || 0}%"></div>
                        </div>
                        <span class="gtf-progress-text">${Math.round(task.progress || 0)}%</span>
                    </div>
                    <div class="gtf-task-stage">${task.stage || task.message || '生成中...'}</div>
                    <div class="gtf-task-actions">
                        <button class="gtf-btn gtf-btn-primary" onclick="viewTaskDetail('${task.task_id}', '${task.type}')">
                            <span class="material-icons" style="font-size: 14px;">visibility</span>
                            查看
                        </button>
                        ${isRunning ? `
                        <button class="gtf-btn gtf-btn-danger" onclick="stopTask('${task.task_id}')">
                            <span class="material-icons" style="font-size: 14px;">stop</span>
                            停止
                        </button>
                        ` : `
                        <button class="gtf-btn gtf-btn-secondary" onclick="dismissTask('${task.task_id}')">
                            <span class="material-icons" style="font-size: 14px;">close</span>
                            关闭
                        </button>
                        `}
                    </div>
                </div>
            `;
        },
        
        // 展开
        expand() {
            this.isExpanded = true;
            this.elements.mini.style.display = 'none';
            this.elements.panel.style.display = 'block';
            this.update();
        },
        
        // 收起
        collapse() {
            this.isExpanded = false;
            this.elements.panel.style.display = 'none';
            this.elements.mini.style.display = 'flex';
        }
    };
    
    // ==================== 轮询更新 ====================
    const Poller = {
        intervalId: null,
        
        start() {
            this.stop();
            this.updateAllTasks();
            this.intervalId = setInterval(() => this.updateAllTasks(), CONFIG.CHECK_INTERVAL);
        },
        
        stop() {
            if (this.intervalId) {
                clearInterval(this.intervalId);
                this.intervalId = null;
            }
        },
        
        async updateAllTasks() {
            const tasks = TaskManager.getRunningTasks();
            if (tasks.length === 0) {
                UI.update();
                return;
            }
            
            // 并发更新所有任务状态
            await Promise.all(tasks.map(task => this.updateTaskStatus(task)));
            
            UI.update();
        },
        
        async updateTaskStatus(task) {
            try {
                let url;
                if (task.type === 'phase_one') {
                    url = `/api/phase-one/task/${task.task_id}/status`;
                } else {
                    url = `/api/market-driven/tasks/${task.task_id}`;
                }
                
                const response = await fetch(url);
                if (!response.ok) return;
                
                const result = await response.json();
                const data = result.data || result;
                
                // 更新任务状态
                TaskManager.updateTask(task.task_id, {
                    progress: data.progress || task.progress,
                    status: data.status || task.status,
                    stage: data.current_step || data.message || task.stage,
                    points_consumed: data.points_consumed || task.points_consumed,
                    last_update: Date.now()
                });
                
                // 如果任务完成，发送通知
                if (['completed', 'failed'].includes(data.status) && 
                    !['completed', 'failed'].includes(task.status)) {
                    this.notifyTaskComplete(task, data.status);
                }
            } catch (e) {
                console.error(`[Poller] 更新任务 ${task.task_id} 失败:`, e);
            }
        },
        
        notifyTaskComplete(task, status) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(
                    status === 'completed' ? '生成完成！' : '生成失败',
                    {
                        body: `${task.title || '未命名任务'} ${status === 'completed' ? '已完成' : '生成失败'}`,
                        icon: '/static/images/logo.png'
                    }
                );
            }
        }
    };
    
    // ==================== 全局函数 ====================
    
    // 展开浮窗
    window.expandTaskFloat = function() {
        UI.expand();
    };
    
    // 收起浮窗
    window.collapseTaskFloat = function() {
        UI.collapse();
    };
    
    // 查看任务详情
    window.viewTaskDetail = function(taskId, type) {
        const urlMap = {
            'market_driven': `/market-driven-status?task=${taskId}`,
            'dialog': `/market-driven-status?task=${taskId}`,
            'phase_one': `/phase-one-setup?task=${taskId}`
        };
        window.location.href = urlMap[type] || urlMap['market_driven'];
    };
    
    // 停止任务
    window.stopTask = async function(taskId) {
        if (!confirm('确定要停止这个生成任务吗？已消耗的点数不会返还。')) {
            return;
        }
        
        try {
            const response = await fetch(`/api/market-driven/tasks/${taskId}/stop`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            
            if (response.ok) {
                TaskManager.updateTask(taskId, { status: 'stopped', stage: '已停止' });
                UI.update();
            } else {
                alert('停止任务失败，请重试');
            }
        } catch (e) {
            console.error('[stopTask] 失败:', e);
            alert('停止任务失败，请重试');
        }
    };
    
    // 关闭任务（从列表移除）
    window.dismissTask = function(taskId) {
        TaskManager.removeTask(taskId);
        UI.update();
    };
    
    // ==================== 对外API ====================
    window.BackgroundTaskManager = {
        // 添加新任务
        addTask(taskData) {
            TaskManager.addTask({
                ...taskData,
                created_at: Date.now(),
                last_update: Date.now()
            });
            UI.checkAndShow();
            Poller.start();
        },
        
        // 更新任务
        updateTask(taskId, updates) {
            TaskManager.updateTask(taskId, updates);
        },
        
        // 获取运行中任务
        getRunningTasks() {
            return TaskManager.getRunningTasks();
        },
        
        // 初始化（异步）
        async init() {
            await UI.init();
            Poller.start();
        }
    };
    
    // ==================== 初始化 ====================
    
    // 页面加载时初始化（异步）
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', async () => await window.BackgroundTaskManager.init());
    } else {
        (async () => await window.BackgroundTaskManager.init())();
    }
    
    // 监听 localStorage 变化（跨页面同步）
    window.addEventListener('storage', function(e) {
        if (e.key === CONFIG.STORAGE_KEY) {
            UI.checkAndShow();
        }
    });
    
    // 请求通知权限
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }
})();
</script>
