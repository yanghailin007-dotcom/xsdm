# GitHub Actions 自动打包工作流
# 只构建 macOS 版本（Windows 版本由本地打包）

name: Build macOS Release

on:
  push:
    tags:
      - 'v*'  # 推送 v 开头的 tag 时触发
  workflow_dispatch:  # 支持手动触发

jobs:
  # macOS 通用构建任务（支持 Intel 和 Apple Silicon）
  build-macos:
    runs-on: macos-14  # Apple Silicon 构建器，可以构建通用版本
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt5 playwright
          playwright install chromium

      - name: Build macOS app
        run: python scripts/build_desktop_macos.py

      - name: Rename artifact
        run: |
          mv desktop_uploader/release/dist/NovelPublisher-macos-arm64.zip desktop_uploader/release/dist/NovelPublisher-macos.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: desktop_uploader/release/dist/NovelPublisher-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
