# AI约束配置
# Layer 5: AI约束

version: "1.0"

word_count:
  target: 2200
  min: 2000
  max: 2500
  tolerance: 0.1

format_rules:
  dialogue_wrapper: '""'
  system_wrapper: "【】"
  paragraph_max_lines: 4
  paragraph_max_chars: 80

forbidden:
  content:
    - description: "爽点回退"
      reason: "爽后突然压抑会打断阅读体验"
    - description: "预告欺诈"
      reason: "章尾预告不兑现会失去读者信任"
    - description: "人设崩塌"
      reason: "角色行为前后矛盾"
    - description: "使用'第X章'作为正文开头"
      reason: "正文不应包含章节标题"
    - description: "使用'起-承-转-合'节奏"
      reason: "网文节奏：前300字入戏，持续高爽，章尾钩子"

safety:
  sensitive_words_filter: true
  political_correctness: true
  violence_level: "轻度"
