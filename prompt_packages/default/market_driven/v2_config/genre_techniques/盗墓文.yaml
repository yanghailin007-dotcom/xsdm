# 盗墓文题材技法
genre: "盗墓文"
version: "1.0.0"
description: "探险寻宝+古墓探秘+风水玄术类小说的专项技法"

# ==================== 1. 核心套路 ====================
core_mechanics:
  description: "主角作为盗墓者或探险家，进入古墓、遗迹探险，破解机关，寻找宝藏，对抗危险"

# ==================== 2. 禁用元素 ====================
forbidden_elements:
  description: "以下元素绝对不能出现"
  items:
    - element: "过度玄幻"
      examples: ["飞天遁地", "修仙", "魔法"]
      reason: "盗墓文应有现实基础"
    - element: "无底线破坏"
      examples: ["恶意破坏文物", "亵渎死者", "不尊重历史"]
      reason: "需要有基本的文物保护意识"
    - element: "脱离探险主线"
      examples: ["过多感情戏", "过多日常", "商战"]
      reason: "应聚焦探险寻宝"

# ==================== 3. 必须元素 ====================
required_elements:
  description: "每章必须包含的元素"
  items:
    - element: "探险场景"
      check: "是否有古墓、遗迹等探险场景"
      severity: "critical"
    - element: "机关/危险"
      check: "是否有机关陷阱或危险生物"
      severity: "critical"
    - element: "风水玄术"
      check: "是否有风水、寻龙点穴等元素"
      severity: "warning"

# ==================== 4. 世界状态初始化 ====================
world_state_initialization:
  protagonist:
    health: "健康"
    abilities_unlocked: ["基础风水知识", "古墓识别"]
  plot_threads:
    - name: "寻宝探险"
      status: "active"
      priority: 10
    - name: "身世之谜"
      status: "active"
      priority: 9
    - name: "神秘组织"
      status: "hidden"
      priority: 8
  system_rules:
    system_name: "盗墓系统"
    system_type: "探险类"
    artifacts_found: 0
    tombs_explored: 0
    danger_level: 1

# ==================== 5. 质量检查点 ====================
quality_checkpoints:
  - point: "探险氛围"
    condition: "保持神秘紧张的探险氛围"
    severity: "critical"
  - point: "机关设计"
    condition: "机关陷阱有创意且合理"
    severity: "critical"
  - point: "历史考据"
    condition: "古墓背景有历史依据"
    severity: "warning"
