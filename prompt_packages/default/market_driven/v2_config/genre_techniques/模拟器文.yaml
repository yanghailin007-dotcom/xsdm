# 模拟器文题材技法
# 版本: 1.0.0
# 用途: 指导AI生成人生模拟器文

genre: "模拟器文"
version: "1.0.0"
description: "可以模拟人生，提前知道未来，改变命运的专项技法"

# ==================== 1. 核心套路 ====================
core_mechanics:
  description: "模拟器文的核心是'预知未来+改变命运'"
  key_points:
    - "获得人生模拟器"
    - "模拟人生，看到未来"
    - "根据模拟结果改变现实"
    - "死亡回溯，重新选择"

# ==================== 2. 模拟器规则 ====================
simulator_rules:
  description: "模拟器的使用规则"
  elements:
    - name: "模拟消耗"
      description: "每次模拟需要消耗资源（能量/积分）"
    - name: "模拟次数"
      description: "每日有限次数，可随等级提升"
    - name: "模拟内容"
      description: "模拟未来的特定事件/人生片段"
    - name: "现实改变"
      description: "根据模拟结果做出不同选择"

# ==================== 3. 禁用元素 ====================
forbidden_elements:
  description: "模拟器文禁止的元素"
  items:
    - element: "模拟无限制"
      examples: ["无限次模拟", "没有消耗"]
      reason: "模拟必须有限制，否则太无敌"
    - element: "模拟必中"
      examples: ["模拟结果100%准确", "没有变数"]
      reason: "模拟结果可以有变数，不是绝对"
    - element: "改变太大"
      examples: ["蝴蝶效应不合理", "随意改变历史"]
      reason: "改变现实要有合理后果"

# ==================== 4. 必须元素 ====================
required_elements:
  description: "模拟器文必须包含的元素"
  items:
    - element: "模拟过程"
      check: "详细的模拟人生过程"
      severity: "critical"
    - element: "模拟结果"
      check: "模拟的结局/关键信息"
      severity: "critical"
    - element: "现实改变"
      check: "根据模拟改变现实选择"
      severity: "critical"

# ==================== 5. 世界状态初始化 ====================
world_state_initialization:
  description: "模拟器文的世界状态初始值"
  
  protagonist:
    health: "健康"
    abilities_unlocked: ["人生模拟器"]
  
  plot_threads:
    - name: "模拟主线"
      status: "active"
      introduced_chapter: 1
      priority: 10
      description: "通过模拟改变命运的主线"
      next_trigger: "持续推进"
    - name: "隐藏结局"
      status: "paused"
      introduced_chapter: 20
      priority: 8
      description: "模拟中发现的隐藏结局"
      next_trigger: "特定条件触发"
  
  system_rules:
    system_name: "人生模拟器"
    system_type: "模拟/预知"
    current_level: "初级"
    unlocked_abilities: ["基础模拟"]

# ==================== 6. 质量检查点 ====================
quality_checkpoints:
  - point: "模拟详细"
    condition: "模拟过程详细具体"
    severity: "critical"
  - point: "限制合理"
    condition: "模拟器限制合理"
    severity: "critical"
  - point: "改变有因"
    condition: "现实改变有合理原因"
    severity: "warning"
