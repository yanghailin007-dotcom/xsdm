# 通用题材技法
# 版本: 1.0.0
# 用途: 当指定题材不存在时使用的默认模板

genre: "通用"
version: "1.0.0"
description: "通用题材技法，适用于未定义的题材类型"

# ==================== 1. 震惊铺展顺序 ====================
shock_progression:
  description: "通用的震惊铺展逻辑"
  steps:
    - order: 1
      name: "现场反应"
      content: "直接见证事件的当事人表情、动作、心理、台词"
      format: "引号\"\"包裹"
    
    - order: 2
      name: "围观反应"
      content: "旁观者、围观者的反应"
      format: "引号\"\"包裹"
    
    - order: 3
      name: "权威反应"
      content: "专家、上层人士的质疑→震惊→行动的递进"
      format: "引号\"\"包裹"
    
    - order: 4
      name: "广泛影响"
      content: "消息扩散后的更大范围影响"
      format: "叙述+侧面描写"

# ==================== 2. 特殊元素规范 ====================
special_elements:
  description: "通用题材没有特定的强制元素"
  required: false
  note: "根据具体剧情需要添加"

# ==================== 3. 系统提示音 ====================
system_prompts:
  - type: "通用提示"
    template: "【系统提示：XXX】"
    usage: "通用系统消息"
  
  - type: "任务提示"
    template: "【任务完成：XXX】"
    usage: "完成任务时"
  
  - type: "警告提示"
    template: "【警告：XXX】"
    usage: "危机或警告时"

# ==================== 4. 禁用元素 ====================
forbidden_elements:
  description: "通用题材没有特定的禁用元素"
  note: "遵循通用的写作规范和道德准则"
  items: []

# ==================== 5. 必须元素 ====================
required_elements:
  description: "通用题材的基本要求"
  items:
    - element: "冲突/悬念"
      check: "前300字有冲突或悬念"
    - element: "章尾钩子"
      check: "章节结尾有悬念"
    - element: "对话"
      check: "对话占比≥50%"

# ==================== 6. 对话占比达成方式 ====================
dialogue_achievement:
  target: "对话占比≥50%"
  methods:
    - method: "增加角色对话"
      description: "关键场景用引号包裹的对话推进"
      weight: "40%"
    
    - method: "增加围观反应"
      description: "路人、旁观者的反应用引号包裹"
      weight: "30%"
    
    - method: "增加系统提示"
      description: "系统消息用【】包裹，计入对话"
      weight: "30%"

# ==================== 7. 节奏要求 ====================
pacing:
  conflict_first_300: true
  mini_burst_every_1000: true
  hook_last_50: true
  no_narration_limit: 200

# ==================== 8. 阶段目标成长指标（用于一阶段生成） ====================
progression_metrics:
  metric_name: "能力/地位/影响力"
  metric_examples:
    - "能力达到新层级"
    - "地位显著提升"
    - "影响力扩大"
  forbidden_concepts:
    - "扮演度"
  stage_templates:
    - description: "建立主角形象，首次展现实力"
      deliverables:
        - "主角获得第一个核心成长/资源"
        - "完成首次实力展现"
        - "震惊全场"
      criteria: "至少1次全场震惊，主角获得实质性成长"
    - description: "快速成长，建立盟友"
      deliverables:
        - "主角实力再上新台阶"
        - "收服第一个盟友"
        - "首次击败强敌"
      criteria: "盟友数量≥1，主角实力明显增强"
    - description: "区域崛起，称霸一方"
      deliverables:
        - "主角成为区域级存在"
        - "击败区域强敌"
        - "掌控核心资源/势力"
      criteria: "区域范围内的主导地位确立"
    - description: "登顶巅峰，横扫天下"
      deliverables:
        - "主角达到顶级实力/地位"
        - "击败顶级对手/势力"
        - "掌控全局"
      criteria: "行业内/世界范围内的顶尖地位确立"
    - description: "终极对决，开启新篇"
      deliverables:
        - "主角触及更高层次"
        - "完成核心终极挑战，达成最终目标"
        - "开启新篇章"
      criteria: "核心冲突取得决定性胜利"
    - description: "圆满结局，主宰一切"
      deliverables:
        - "主角达到最强状态"
        - "守护核心利益/重要之人"
        - "达成最终目标"
      criteria: "所有核心目标达成，圆满结局"

# ==================== 9. 质量检查点 ====================
quality_checkpoints:
  - point: "冲突开场"
    condition: "前300字有冲突"
    severity: "critical"
  
  - point: "章尾钩子"
    condition: "有悬念"
    severity: "critical"
  
  - point: "对话占比"
    condition: "≥50%"
    severity: "warning"
