genre: 文娱文
version: 1.0.0
description: 文抄公+文娱逆袭+艺术创作类小说的专项技法
core_mechanics:
  description: 主角利用地球文化作品在异世界或平行世界装逼打脸，成为文娱界的传奇人物
forbidden_elements:
  description: 以下元素绝对不能出现
  items:
  - element: 过度贬低原作
    examples:
    - 无脑贬低原世界作品
    - 恶意嘲讽原住民
    reason: 需要尊重原作品和读者
  - element: 脱离文娱主线
    examples:
    - 突然修仙
    - 突然争霸
    - 过多商战
    reason: 应聚焦文娱创作
  - element: 抄袭争议
    examples:
    - 不当引用
    - 版权争议
    - 恶意剽窃
    reason: 文抄也要有底线
required_elements:
  description: 每章必须包含的元素
  items:
  - element: 作品展示
    check: 是否有文学作品/歌曲/影视的展示
    severity: critical
  - element: 震惊反应
    check: 是否有他人对作品的震惊反应
    severity: critical
  - element: 文娱元素
    check: 是否有创作、表演、比赛等文娱活动
    severity: warning
world_state_initialization:
  protagonist:
    health: 健康
    abilities_unlocked:
    - 地球文娱记忆
  plot_threads:
  - name: 作品搬运
    status: active
    priority: 10
  - name: 名声积累
    status: active
    priority: 9
  - name: 文坛登顶
    status: pending
    priority: 8
  system_rules:
    system_name: 文娱系统
    system_type: 成就类
    fame: 0
    works_count: 0
    fans: 0
quality_checkpoints:
- point: 作品质量
  condition: 搬运的作品有质量保障
  severity: critical
- point: 震惊铺展
  condition: 震惊反应层层递进
  severity: critical
- point: 文娱氛围
  condition: 保持文娱创作的氛围
  severity: warning
progression_metrics:
  metric_name: 作品热度/文坛地位/影响力
  metric_examples:
  - 首部作品爆款
  - 文坛地位提升
  - 粉丝破百万
  forbidden_concepts:
  - 扮演度
  - 国运
  - 修仙
  stage_templates:
  - description: 初露锋芒，获得首个成就
    deliverables:
    - 掌握第一个核心技能/资源
    - 完成首次成功展示
    - 获得关键认可
    criteria: 至少1次关键认可，主角获得实质性进展
  - description: 稳步发展，建立人脉班底
    deliverables:
    - 技能/事业再上新台阶
    - 收服第一个核心盟友/粉丝
    - 击败首个竞争对手
    criteria: 核心盟友≥1，事业/技能明显进步
  - description: 区域成名，成为一方翘楚
    deliverables:
    - 主角成为区域级存在
    - 击败区域强敌/对手
    - 掌控核心资源/市场
    criteria: 区域范围内的话语权确立
  - description: 行业登顶，影响力爆棚
    deliverables:
    - 主角达到顶级技能/地位
    - 击败顶级对手/竞争者
    - 掌控行业话语权
    criteria: 行业内/全国范围内的顶尖地位确立
  - description: 跨界封神，开启新篇
    deliverables:
    - 主角触及更高层次/新领域
    - 击败终极对手/完成终极挑战
    - 开启新篇章
    criteria: 核心挑战取得决定性胜利
  - description: 圆满结局，人生巅峰
    deliverables:
    - 主角达到最强状态/最高成就
    - 守护核心利益/重要之人
    - 达成最终人生目标
    criteria: 所有核心目标达成，圆满结局
