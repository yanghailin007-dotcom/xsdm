# 历史架空文题材技法
genre: "历史架空文"
version: "1.0.0"
description: "权谋争霸+历史穿越+王朝更迭类小说的专项技法"

# ==================== 1. 核心套路 ====================
core_mechanics:
  description: "主角穿越或重生到架空或真实历史时期，通过权谋、军事、改革等手段争霸天下"

# ==================== 2. 禁用元素 ====================
forbidden_elements:
  description: "以下元素绝对不能出现"
  items:
    - element: "超自然力量主导"
      examples: ["修仙", "魔法", "超能力"]
      reason: "破坏历史文的厚重感"
    - element: "过于超前的科技"
      examples: ["核武器", "飞机", "互联网"]
      reason: "需要符合历史发展水平"
    - element: "不尊重历史"
      examples: ["恶意歪曲历史人物", "历史虚无主义"]
      reason: "基于真实历史时要有基本尊重"

# ==================== 3. 必须元素 ====================
required_elements:
  description: "每章必须包含的元素"
  items:
    - element: "历史细节"
      check: "是否有符合时代背景的细节描写"
      severity: "critical"
    - element: "权谋斗争"
      check: "是否有政治或军事上的博弈"
      severity: "critical"
    - element: "人物塑造"
      check: "历史人物是否立体可信"
      severity: "warning"

# ==================== 4. 世界状态初始化 ====================
world_state_initialization:
  protagonist:
    health: "健康"
    abilities_unlocked: ["现代知识", "历史先知"]
  plot_threads:
    - name: "争霸天下"
      status: "active"
      priority: 10
    - name: "改革变法"
      status: "active"
      priority: 9
    - name: "人才收拢"
      status: "active"
      priority: 8
  system_rules:
    system_name: "王朝系统"
    system_type: "策略类"
    territory: "初始领地"
    reputation: 0
    followers: 0

# ==================== 5. 质量检查点 ====================
quality_checkpoints:
  - point: "历史合理性"
    condition: "符合历史发展逻辑"
    severity: "critical"
  - point: "权谋逻辑"
    condition: "权谋斗争有智慧、有逻辑"
    severity: "critical"
  - point: "人物塑造"
    condition: "历史人物鲜活立体"
    severity: "warning"
