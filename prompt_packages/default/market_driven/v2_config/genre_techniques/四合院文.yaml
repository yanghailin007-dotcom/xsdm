genre: 四合院文
version: 1.0.0
description: 四合院日常+邻里关系+年代生活类小说的专项技法
core_mechanics:
  description: 以四合院为背景，描写邻里间的家长里短、人情冷暖、生活琐事，体现年代特色和生活气息
forbidden_elements:
  description: 以下元素绝对不能出现
  items:
  - element: 超自然力量
    examples:
    - 修仙
    - 异能
    - 系统
    - 空间
    reason: 破坏年代生活的真实感
  - element: 过于现代化的物品
    examples:
    - 智能手机
    - 互联网
    - 高铁
    reason: 与年代背景不符
  - element: 官场权谋
    examples:
    - 政治斗争
    - 高层博弈
    - 机密文件
    reason: 这是官场文的元素
required_elements:
  description: 每章必须包含的元素
  items:
  - element: 邻里互动
    check: 是否有四合院内邻居间的交流或冲突
    severity: critical
  - element: 年代细节
    check: 是否有符合年代的生活细节描写
    severity: critical
  - element: 生活气息
    check: 是否有做饭、聊天、串门等日常场景
    severity: warning
world_state_initialization:
  protagonist:
    health: 健康
    abilities_unlocked: []
  plot_threads:
  - name: 邻里关系
    status: active
    priority: 10
  - name: 家庭生活
    status: active
    priority: 9
  - name: 年代变迁
    status: active
    priority: 8
  system_rules:
    system_name: 年代生活
    system_type: 现实主义
    era: 60-90年代
quality_checkpoints:
- point: 年代真实感
  condition: 物品、语言、生活方式符合年代
  severity: critical
- point: 四合院氛围
  condition: 体现出四合院独特的人际关系
  severity: critical
- point: 生活细节
  condition: 有丰富的生活细节描写
  severity: warning
progression_metrics:
  metric_name: 家庭地位/财富/人脉
  metric_examples:
  - 家庭地位提升
  - 完成首次财富积累
  - 建立关键人脉
  forbidden_concepts:
  - 国运
  - 修仙
  stage_templates:
  - description: 初露锋芒，获得首个成就
    deliverables:
    - 掌握第一个核心技能/资源
    - 完成首次成功展示
    - 获得关键认可
    criteria: 至少1次关键认可，主角获得实质性进展
  - description: 稳步发展，建立人脉班底
    deliverables:
    - 技能/事业再上新台阶
    - 收服第一个核心盟友/粉丝
    - 击败首个竞争对手
    criteria: 核心盟友≥1，事业/技能明显进步
  - description: 区域成名，成为一方翘楚
    deliverables:
    - 主角成为区域级存在
    - 击败区域强敌/对手
    - 掌控核心资源/市场
    criteria: 区域范围内的话语权确立
  - description: 行业登顶，影响力爆棚
    deliverables:
    - 主角达到顶级技能/地位
    - 击败顶级对手/竞争者
    - 掌控行业话语权
    criteria: 行业内/全国范围内的顶尖地位确立
  - description: 跨界封神，开启新篇
    deliverables:
    - 主角进入新阶段/拓展新方向
    - 击败终极对手/完成终极挑战
    - 开启新篇章
    criteria: 核心挑战取得决定性胜利
  - description: 圆满结局，人生巅峰
    deliverables:
    - 主角达到最强状态/最高成就
    - 守护核心利益/重要之人
    - 达成最终人生目标
    criteria: 所有核心目标达成，圆满结局
