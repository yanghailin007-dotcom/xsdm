# 核心设定配置
# Layer 1: 世界观、金手指、主角人设

version: "1.0"

# 世界观设定
worldview:
  overview: |
    这是一个现代都市背景的世界，存在着普通人无法察觉的"高维"存在。
    主角苏泽是一名普通的外卖员，因为一次意外获得了神秘的"神豪盲盒系统"，
    从此开启了逆天改命的神豪之路。
  
  core_rules:
    - rule: "金钱即权力"
      description: "在这个世界，资本的力量可以影响规则，甚至可以对抗超自然力量"
    - rule: "高维观察者存在"
      description: "存在超越人类维度的观察者，禁地是他们投放的试炼场"
    - rule: "国运绑定机制"
      description: "某些特殊个体与国家命运绑定，主角就是龙国的国运绑定者"
  
  power_system:
    name: "神豪心境扮演度"
    levels:
      - "LV1-暴发户心态：有钱就花，不懂规则"
      - "LV2-神豪心态：用钱办事，掌控局面"
      - "LV3-资本主宰：制定规则，操控大势"
      - "LV4-维度之主：超越金钱，触及法则"
    upgrade_method: "通过完成系统任务、消费返利、打脸反派获得心境值"
    current_level: "LV2-神豪心态（扮演度60%）"
  
  world_rules:
    - "系统每日零点开启盲盒"
    - "消费可获得返利，返利倍数与扮演度挂钩"
    - "高维观察者会关注表现突出的个体"
    - "禁地与现世间存在通道"

# 金手指设定
golden_finger:
  name: "神豪盲盒系统"
  type: "系统流"
  core_mechanism: |
    每日零点开启盲盒，盲盒内容随机，包含：现金、实物、技能、人才等。
    消费可获得返利，返利倍数根据扮演度提升。
    完成系统任务可获得额外奖励。
  current_level: "LV2"
  current_ability: |
    - 每日盲盒（基础奖励）
    - 消费返利（2-10倍）
    - 雷神之锤（完整形态）
    - 九霄神雷（充能120%）
  limitations:
    - "盲盒开启时间严格锁定每日零点"
    - "高维存在可以压制系统能力"
    - "法则压制区域无法使用部分能力"
  growth_path:
    - "扮演度达到30%：解锁神级管家"
    - "扮演度达到50%：解锁维度感知"
    - "扮演度达到80%：解锁法则抗性"
    - "扮演度达到100%：解锁维度之主"
  reward_sound: "【叮！恭喜宿主...】"

# 主角设定
protagonist:
  name: "苏泽"
  age: 22
  background: |
    原本是一个普通的外卖员，被前女友背叛、被亲戚嘲讽、被上司压榨。
    获得神豪盲盒系统后，开启逆天改命之路。
  surface_identity: "江城神秘富豪"
  true_identity: "雷神之锤继承者、龙国国运绑定者"
  personality_tags:
    - "冷静理智"
    - "杀伐果断"
    - "极致护短"
    - "有恩必报"
    - "从不圣母"
  core_motivation: |
    通过积累财富和实力，最终对抗高维观察者，
    拯救被禁地威胁的世界，保护自己在乎的人。
  catchphrases:
    - "有钱，真的可以为所欲为。"
    - "三分钟？杀你，只需要三秒。"
    - "既然你们想玩，那我就把这天，彻底捅穿。"
  signature_actions:
    - "淡淡地扫一眼，语气平静"
    - "嘴角勾起一抹玩味的笑意"
    - "随手掏出黑卡"
    - "指尖雷光流转"
  forbidden_behaviors:
    - "不能圣母，对敌人绝不手软"
    - "不能情绪失控，始终保持冷静"
    - "不能暴露全部底牌"
    - "不能忘记报恩"

# 核心爽点公式
burst_formula:
  pattern: |
    压抑（反派嚣张）→ 铺垫（主角冷静）→ 
    反转（展示实力）→ 高潮（反派崩溃）→ 
    收获（获得奖励）→ 钩子（新危机出现）
  
  shock_hierarchy:
    - "第一层：现场当事人震惊"
    - "第二层：围观群众震惊"
    - "第三层：上层社会/媒体震惊"
    - "第四层：敌对势力震惊"
    - "第五层：高维存在关注"
  
  reward_types:
    - "即时奖励：返利到账提示"
    - "技能奖励：新能力解锁"
    - "人才奖励：顶级人才效忠"
    - "地位奖励：身份地位提升"
    - "信息奖励：隐藏剧情线索"

# 核心禁忌
core_taboos:
  - "禁止主角圣母行为"
  - "禁止反派智商下线"
  - "禁止系统过于万能"
  - "禁止爽点回退（爽后突然压抑）"
  - "禁止预告欺诈（章尾预告不兑现）"
