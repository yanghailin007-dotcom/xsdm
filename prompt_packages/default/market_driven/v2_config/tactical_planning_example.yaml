# 战术规划配置
# Layer 2: 阶段目标、章节目标、情绪节奏

version: "1.0"

# 当前阶段信息
current_stage:
  name: "第一阶段：初入神豪"
  range: "第1-30章"
  theme: "建立神豪身份，初步清算敌人"
  emotion_tone: "压抑→爆发→爽快的情绪过山车"
  
  stage_goals:
    - goal: "建立神豪人设"
      description: "从外卖员到江城顶级富豪的身份转变"
      deliverable: "获得百亿资产，入住顶级豪宅"
    
    - goal: "初步清算"
      description: "对前女友、上司等前期反派的清算"
      deliverable: "前女友社会性死亡，上司被开除"
    
    - goal: "进入上流圈层"
      description: "获得江城上流社会的认可"
      deliverable: "获得行政豁免权，进入名媛圈"
    
    - goal: "金手指升级"
      description: "通过完成任务提升扮演度"
      deliverable: "扮演度达到30%，解锁神级管家"
  
  key_constraints:
    - "每章必须有一次消费打脸"
    - "每5章必须有一次大高潮"
    - "每章结尾必须有钩子"
    - "禁止提前暴露全部实力"

# 章节结构设计
chapter_structure:
  word_count_target: 2200
  word_count_min: 2000
  word_count_max: 2500
  
  section_distribution:
    opening: # 0-15%
      word_count: "300-400字"
      requirement: "前300字必须有冲突/悬念"
      content: "引入冲突、展示反派嚣张"
    
    buildup: # 15-45%
      word_count: "600-800字"
      requirement: "铺垫情绪、反派持续施压"
      content: "反派加码、主角看似弱势"
    
    climax: # 45-75%
      word_count: "600-800字"
      requirement: "主角反击、爽点爆发"
      content: "展示实力、反派崩溃、全场震惊"
    
    resolution: # 75-90%
      word_count: "400-500字"
      requirement: "收获奖励、展示成果"
      content: "返利到账、地位提升、敌人绝望"
    
    hook: # 90-100%
      word_count: "100-150字"
      requirement: "最后50字必须是悬念"
      content: "新危机出现、新人物登场、新线索揭示"

# 情绪节奏设计
emotion_phases:
  - phase: "打脸章"
    curve: "虐(4)→急(7)→爽(9)→悬(7)"
    description: "反派挑衅→主角反击→全场震惊→钩子"
    usage: "常规打脸剧情"
  
  - phase: "爆发章"
    curve: "蓄(3)→爆(10)→收(5)"
    description: "铺垫积累→全力爆发→结果展示"
    usage: "大高潮剧情"
  
  - phase: "收获章"
    curve: "争(6)→得(8)→惊(7)"
    description: "争夺竞争→获得宝物→众人震惊"
    usage: "获得奖励剧情"
  
  - phase: "危机章"
    curve: "安(3)→危(8)→逃(6)"
    description: "平静开局→突发危机→惊险脱身"
    usage: "引入新危机"
  
  - phase: "铺垫章"
    curve: "平(4)→伏(5)→引(6)"
    description: "日常描写→埋设线索→引出下文"
    usage: "过渡章节"

# 爽点设计模板
burst_designs:
  - type: "消费打脸"
    template: |
      场景：{奢侈场所}
      反派：{看不起主角的人}
      触发：{反派的嘲讽行为}
      反击：{主角的消费行为}
      爽点：{精确金额} + {周围人计算} + {反派崩溃}
      奖励：【叮！返利XXX到账】
    
  - type: "身份揭露"
    template: |
      场景：{重要场合}
      反派：{不知情的挑衅者}
      触发：{要求主角证明身份}
      反击：{展示真实身份/实力}
      爽点：{全场震惊} + {反派跪舔} + {地位逆转}
      奖励：{上层认可} + {新权限解锁}
    
  - type: "能力展示"
    template: |
      场景：{危险/挑战场景}
      反派：{强大对手}
      触发：{反派展示实力}
      反击：{主角使用系统能力}
      爽点：{实力碾压} + {技能特效} + {敌人绝望}
      奖励：{技能升级} + {新能力解锁}

# 钩子设计模板
hook_designs:
  - type: "危机降临型"
    template: "主角刚成功→突然→【警告】新危机出现→悬念截止"
    example: "苏白刚收好战利品，突然——【全球通告】警告！检测到SS级凶兽正在接近！"
  
  - type: "身份揭露型"
    template: "关键时刻→有人即将发现真相→揭露前截止"
    example: "等等！白月魁突然盯着苏白，你刚才用的那招...根本不是盲人的战斗方式！"
  
  - type: "系统提示型"
    template: "完成某事→系统提示→出乎意料的奖励/惩罚"
    example: "【叮！恭喜宿主完成隐藏任务！】【奖励：扮演度+20%】【警告：您已被标记为SS级目标！】"
  
  - type: "时间锁型"
    template: "倒计时开始→时间紧迫→截止"
    example: "【系统提示】禁地第二区域即将开启，倒计时：23小时59分。【警告】第二区域难度提升100%！"
  
  - type: "对峙爆发型"
    template: "正面对峙→剑拔弩张→动手前一秒截止"
    example: "约翰带着人堵住洞口：终于找到你了，龙国的瞎子。苏白站起身，嘴角勾起冷笑：你确定要在这里动手？"

# 当前章节战术规划（示例）
current_chapter:
  chapter_num: 19
  chapter_type: "打脸章"
  emotion_curve: "虐(4)→急(7)→爽(9)→悬(7)"
  
  tactical_goals:
    - "展示主角新获得的雷神之锤能力"
    - "消费五亿以上，触发十倍返利"
    - "打脸陆子豪（魔都买办家族继承人）"
    - "引出高维观察者的关注"
  
  key_elements:
    - "精确金额：5.2亿"
    - "返利金额：52亿"
    - "新道具：至尊龙卡"
    - "新敌人：高维观察者"
  
  hook_type: "危机降临型"
  hook_content: "高维观察者出现，时间冻结，警告主角"
